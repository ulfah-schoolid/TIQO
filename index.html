/* Validasi soal: setiap soal pilihan harus punya tepat satu jawaban benar,
   dan pilihan tidak boleh kembar. Dipakai setiap kali misi dimulai. */
function validateRounds(rounds) {
  for (const r of rounds) {
    if (r.kind === 'choice') {
      if (r.options.filter(o => o.correct).length !== 1) return false;
      const right = r.options.find(o => o.correct);
      if (r.options.some(o => !o.correct && o.html === right.html)) return false;
    } else if (r.kind === 'findAll') {
      if (!r.items.some(i => i.correct)) return false;
    } else if (r.kind === 'order') {
      if (r.items.length !== r.answer.length) return false;
      if (r.steps && r.answer.some((v, k) => k && v <= r.answer[k - 1])) return false;
    } else if (r.kind === 'code') {
      if (!r.puzzle || r.puzzle.solution.length > r.slots) return false;
      if (Code.simulate(r.puzzle, r.puzzle.solution).end !== 'goal') return false;
    } else if (r.kind === 'trace') {
      if (r.mode === 'path' && !(r.strokes && r.strokes.length)) return false;
      if (r.mode === 'mask' && !r.ch) return false;
    } else if (r.kind === 'memory') {
      const c = {}; r.cards.forEach(x => c[x.key] = (c[x.key] || 0) + 1);
      if (Object.values(c).some(v => v !== 2)) return false;
    }
  }
  return true;
}
function buildRounds(m) {
  for (let i = 0; i < 20; i++) {
    const r = Gen[m.gen](m.params || {}, m.rounds);
    if (validateRounds(r)) return r;
  }
  throw new Error('Soal tidak valid untuk misi ' + m.id);
}
const missionById = id => MISSIONS.find(m => m.id === id);
const islandById = id => TIQO_CONFIG.islands.find(i => i.id === id);
const missionsOf = islandId => MISSIONS.filter(m => m.island === islandId);

/* =========================================================
   6. PENYIMPANAN LOKAL
   - Pengaturan sederhana  → localStorage ("tiqo:settings")
   - Profil & progres anak → IndexedDB ("tiqo-db")
   Jika IndexedDB tidak tersedia (mis. mode privat tertentu),
   data disimpan ke localStorage sebagai cadangan.
   Tidak ada data yang dikirim ke server.
   ========================================================= */
const Store = (() => {
  const SETTINGS_KEY = 'tiqo:settings', FALLBACK_KEY = 'tiqo:fallback', DB = 'tiqo-db', VER = 1;
  const DEFAULT_SETTINGS = {
    narration: true, sfx: true, rate: 'normal',
    showSchool: TIQO_CONFIG.school.enabledByDefault,
    schoolLine: TIQO_CONFIG.school.line, schoolName: TIQO_CONFIG.school.name,
    playLimit: 0, bedtime: 0,
    activeProfileId: null
  };
  let settings = { ...DEFAULT_SETTINGS };
  let profiles = [], progress = {}, db = null, mode = 'idb', ok = true;

  // ---- localStorage aman ----
  const ls = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ---- IndexedDB ----
  function openDB() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no-idb'));
      let req;
      try { req = indexedDB.open(DB, VER); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('profiles')) d.createObjectStore('profiles', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('progress')) d.createObjectStore('progress', { keyPath: 'profileId' });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('blocked'));
      setTimeout(() => rej(new Error('timeout')), 4000);
    });
  }
  const tx = (store, m = 'readonly') => db.transaction(store, m).objectStore(store);
  const all = store => new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  const put = (store, v) => new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(v); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  const del = (store, k) => new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  const clear = store => new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).clear(); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });

  function saveFallback() { ok = ls.set(FALLBACK_KEY, { profiles, progress }); }

  async function persistProfile(p) {
    try { if (mode === 'idb') await put('profiles', p); else saveFallback(); }
    catch (e) { console.warn('Gagal menyimpan profil', e); ok = false; }
  }
  async function persistProgress(pid) {
    try { if (mode === 'idb') await put('progress', progress[pid]); else saveFallback(); }
    catch (e) { console.warn('Gagal menyimpan progres', e); ok = false; }
  }

  const newProgress = pid => ({ profileId: pid, schema: 1, missions: {}, days: [], daily: {}, dailyPick: null, badges: {}, lastPlayed: null });

  async function init() {
    settings = { ...DEFAULT_SETTINGS, ...(ls.get(SETTINGS_KEY) || {}) };
    try {
      db = await openDB();
      profiles = await all('profiles');
      (await all('progress')).forEach(p => progress[p.profileId] = p);
    } catch (e) {
      console.warn('IndexedDB tidak tersedia, memakai localStorage.', e);
      mode = 'ls';
      const fb = ls.get(FALLBACK_KEY) || {};
      profiles = fb.profiles || []; progress = fb.progress || {};
    }
    profiles.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    if (!profiles.length) await addProfile({ nickname: 'Teman TIQO', avatar: '🐥', age: 'semua' }, true);
    if (!profiles.some(p => p.id === settings.activeProfileId)) setSetting('activeProfileId', profiles[0].id);
    profiles.forEach(p => { if (!progress[p.id]) progress[p.id] = newProgress(p.id); });
  }

  function setSetting(k, v) { settings[k] = v; if (!ls.set(SETTINGS_KEY, settings)) ok = false; }

  async function addProfile({ nickname, avatar, age }, silent) {
    const p = { id: U.uid(), nickname: (nickname || 'Teman TIQO').trim().slice(0, 20) || 'Teman TIQO', avatar: avatar || '🐥', age: age || 'semua', createdAt: Date.now() };
    profiles.push(p); progress[p.id] = newProgress(p.id);
    await persistProfile(p); await persistProgress(p.id);
    if (!silent) setSetting('activeProfileId', p.id);
    return p;
  }
  async function updateProfile(id, patch) {
    const p = profiles.find(x => x.id === id); if (!p) return;
    if ('nickname' in patch) patch.nickname = (patch.nickname || '').trim().slice(0, 20) || 'Teman TIQO';
    Object.assign(p, patch); await persistProfile(p);
  }
  async function deleteProfile(id) {
    profiles = profiles.filter(p => p.id !== id); delete progress[id];
    try { if (mode === 'idb') { await del('profiles', id); await del('progress', id); } else saveFallback(); } catch (e) { ok = false; }
    if (!profiles.length) await addProfile({ nickname: 'Teman TIQO', avatar: '🐥', age: 'semua' }, true);
    if (settings.activeProfileId === id) setSetting('activeProfileId', profiles[0].id);
  }
  async function resetProgress(id) { progress[id] = newProgress(id); await persistProgress(id); }

  // Catat hasil misi. Mengembalikan objek progres terbaru.
  async function recordMission(pid, missionId, stars, isDaily) {
    const pr = progress[pid] || (progress[pid] = newProgress(pid));
    const today = U.todayKey();
    const m = pr.missions[missionId] || { best: 0, plays: 0, last: null };
    m.best = Math.max(m.best, stars); m.plays += 1; m.last = today;
    pr.missions[missionId] = m;
    if (!pr.days.includes(today)) pr.days.push(today);
    if (pr.days.length > 400) pr.days = pr.days.slice(-400);
    if (isDaily) pr.daily[today] = missionId;
    pr.lastPlayed = today;
    await persistProgress(pid);
    return pr;
  }
  async function saveProgress(pid) { await persistProgress(pid); }

  function exportAll() {
    return { app: 'tiqo', format: 1, exportedAt: new Date().toISOString(), version: TIQO_CONFIG.version,
      profiles: profiles.map(p => ({ ...p })), progress: profiles.map(p => progress[p.id]).filter(Boolean),
      settings: { narration: settings.narration, sfx: settings.sfx, rate: settings.rate, showSchool: settings.showSchool, schoolLine: settings.schoolLine, schoolName: settings.schoolName, playLimit: settings.playLimit, bedtime: settings.bedtime } };
  }
  async function importAll(data) {
    if (!data || data.app !== 'tiqo' || !Array.isArray(data.profiles) || !Array.isArray(data.progress) || !data.profiles.length) throw new Error('Berkas cadangan tidak dikenali.');
    const ps = data.profiles.filter(p => p && typeof p.id === 'string').slice(0, TIQO_CONFIG.maxProfiles).map(p => ({
      id: p.id, nickname: String(p.nickname || 'Teman TIQO').slice(0, 20), avatar: String(p.avatar || '🐥').slice(0, 8),
      age: ['4', '5-6', 'semua'].includes(p.age) ? p.age : 'semua', createdAt: Number(p.createdAt) || Date.now() }));
    if (!ps.length) throw new Error('Tidak ada profil di berkas cadangan.');
    const prs = {};
    ps.forEach(p => {
      const src = data.progress.find(x => x && x.profileId === p.id) || {};
      const missions = {};
      Object.entries(src.missions || {}).forEach(([k, v]) => { if (missionById(k) && v) missions[k] = { best: Math.min(3, Math.max(0, Number(v.best) || 0)), plays: Number(v.plays) || 0, last: v.last || null }; });
      prs[p.id] = { ...newProgress(p.id), missions, days: Array.isArray(src.days) ? src.days.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)) : [],
        daily: src.daily && typeof src.daily === 'object' ? src.daily : {}, badges: src.badges && typeof src.badges === 'object' ? src.badges : {}, lastPlayed: src.lastPlayed || null };
    });
    await wipeData();
    profiles = ps; progress = prs;
    for (const p of profiles) { await persistProfile(p); await persistProgress(p.id); }
    if (data.settings) ['narration','sfx','rate','showSchool','schoolLine','schoolName','playLimit','bedtime'].forEach(k => { if (k in data.settings) settings[k] = data.settings[k]; });
    setSetting('activeProfileId', profiles[0].id);
  }
  async function wipeData() {
    try { if (mode === 'idb') { await clear('profiles'); await clear('progress'); } } catch (e) {}
    ls.del(FALLBACK_KEY); profiles = []; progress = {};
  }
  async function wipeAll() {
    await wipeData(); ls.del(SETTINGS_KEY); settings = { ...DEFAULT_SETTINGS };
    await addProfile({ nickname: 'Teman TIQO', avatar: '🐥', age: 'semua' }, true);
    setSetting('activeProfileId', profiles[0].id);
  }

  return {
    init, setSetting, addProfile, updateProfile, deleteProfile, resetProgress, recordMission, saveProgress, exportAll, importAll, wipeAll,
    get settings() { return settings; },
    get profiles() { return profiles; },
    get mode() { return mode; },
    get healthy() { return ok; },
    active() { return profiles.find(p => p.id === settings.activeProfileId) || profiles[0]; },
    progressOf(pid) { return progress[pid] || (progress[pid] = newProgress(pid)); }
  };
})();

/* =========================================================
   7. SUARA
   - Narasi memakai suara otomatis dari perangkat (Web Speech API,
     bahasa Indonesia). Kualitas suara bergantung pada HP.
   - Efek suara dibuat langsung dengan Web Audio (tanpa file).
   Rekaman suara asli dapat ditambahkan kelak: isi AUDIO_CLIPS
   dengan { "kalimat": "assets/audio/xxx.mp3" } dan narasi akan
   memutar rekaman itu lebih dulu bila tersedia.
   ========================================================= */
const AUDIO_CLIPS = {};
const Sound = (() => {
  const synth = window.speechSynthesis;
  let voice = null, enVoice = null, ctx = null, clip = null;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices();
    voice = vs.find(v => /^id[-_]ID/i.test(v.lang) && /female|wanita|gadis|damayanti/i.test(v.name))
         || vs.find(v => /^id[-_]ID/i.test(v.lang)) || vs.find(v => /^id/i.test(v.lang)) || null;
    enVoice = vs.find(v => /^en[-_]US/i.test(v.lang) && /female|samantha|zira|aria|jenny/i.test(v.name))
         || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  // Pecah kalimat menjadi bagian Indonesia dan Inggris. Kata Inggris ditandai [[en:Kata]].
  function segments(text) {
    const out = [], re = /\[\[en:([^\]]+)\]\]/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push({ t: text.slice(last, m.index), en: false });
      out.push({ t: m[1], en: true }); last = re.lastIndex;
    }
    if (last < text.length) out.push({ t: text.slice(last), en: false });
    return out.filter(s => s.t.replace(/[\s.,!?]/g, ''));
  }
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }

  function stop() {
    try { synth && synth.cancel(); } catch (e) {}
    if (clip) { clip.pause(); clip = null; }
  }
  function say(text) {
    if (!Store.settings.narration || !text) return;
    stop();
    if (AUDIO_CLIPS[text]) { clip = new Audio(AUDIO_CLIPS[text]); clip.play().catch(() => {}); return; }
    if (!synth) return;
    const slow = Store.settings.rate === 'lambat';
    const list = segments(text).map(s => {
      const u = new SpeechSynthesisUtterance(s.t.replace(/[⭐🔊]/g, '').replace(/'/g, ''));
      if (s.en) { u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = slow ? 0.7 : 0.8; u.pitch = 1.1; }
      else { u.lang = 'id-ID'; if (voice) u.voice = voice; u.rate = slow ? 0.78 : 0.92; u.pitch = 1.12; }
      return u;
    });
    // Beberapa browser Android butuh jeda kecil setelah cancel()
    setTimeout(() => { try { list.forEach(u => synth.speak(u)); } catch (e) {} }, 60);
  }

  // ---- Efek suara lembut ----
  function ac() {
    if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type = 'sine', vol = .16) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  const fx = {
    tap() { tone(660, 0, .08, 'triangle', .07); },
    right() { tone(784, 0, .16, 'triangle'); tone(1047, .1, .26, 'triangle'); },
    soft() { tone(392, 0, .18, 'sine', .08); },           // bunyi netral saat belum tepat (bukan bunyi "salah")
    flip() { tone(520, 0, .07, 'triangle', .06); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle', .14)); },
    star() { tone(1175, 0, .2, 'sine', .1); tone(1568, .08, .25, 'sine', .08); }
  };
  function play(name) { if (!Store.settings.sfx) return; try { fx[name] && fx[name](); } catch (e) {} }
  // Buka kunci audio pada sentuhan pertama (aturan browser HP)
  function unlock() { if (Store.settings.sfx) ac(); }

  return { say, stop, play, unlock, hasVoice: () => !!voice, hasEnglish: () => !!enVoice, supported: !!synth };
})();

/* =========================================================
   8. BINTANG, HADIAH, DAN MISI HARI INI
   Semua dihitung dari catatan permainan yang nyata.
   ========================================================= */
const Rewards = (() => {
  // Nilai per tantangan: 1 = benar pada percobaan pertama, 0.5 = percobaan kedua, 0.2 = setelahnya.
  // Selesai misi selalu mendapat minimal 1 bintang.
  function starsFor(scores) {
    const avg = scores.reduce((a, b) => a + b, 0) / Math.max(1, scores.length);
    return avg >= 0.8 ? 3 : avg >= 0.5 ? 2 : 1;
  }

  function summary(pid) {
    const pr = Store.progressOf(pid);
    const done = MISSIONS.filter(m => pr.missions[m.id]);
    const stars = done.reduce((a, m) => a + pr.missions[m.id].best, 0);
    const perIsland = {};
    TIQO_CONFIG.islands.forEach(i => {
      const ms = missionsOf(i.id);
      perIsland[i.id] = { total: ms.length, done: ms.filter(m => pr.missions[m.id]).length,
        stars: ms.reduce((a, m) => a + (pr.missions[m.id]?.best || 0), 0), max: ms.length * 3 };
    });
    return { pr, done: done.length, total: MISSIONS.length, stars, maxStars: MISSIONS.length * 3, perIsland,
      perfect: done.filter(m => pr.missions[m.id].best === 3).length, dailyCount: Object.keys(pr.daily).length, days: pr.days.length };
  }

  const isl = id => islandById(id);
  const islandDone = (s, id) => s.perIsland[id].done === s.perIsland[id].total;
  // Daftar hadiah. progress() → [nilai sekarang, target]
  const BADGES = [
    { id:'pertama',  name:'Bintang Pertama',   desc:'Kumpulkan 1 bintang.',                      color:'#FFE08A', icon:'star',     progress: s => [Math.min(s.stars, 1), 1] },
    { id:'huruf',    name:'Penjelajah Huruf',  desc:'Selesaikan semua misi Pulau Huruf.',        color:'#BDE7F5', icon:'huruf',    progress: s => [s.perIsland.huruf.done, s.perIsland.huruf.total] },
    { id:'angka',    name:'Jago Berhitung',    desc:'Selesaikan semua misi Pulau Angka.',        color:'#FFE8A3', icon:'angka',    progress: s => [s.perIsland.angka.done, s.perIsland.angka.total] },
    { id:'warna',    name:'Ahli Warna',        desc:'Selesaikan semua misi Taman Warna.',        color:'#DDF1D8', icon:'warna',    progress: s => [s.perIsland.warna.done, s.perIsland.warna.total] },
    { id:'logika',   name:'Penemu Pola',       desc:'Selesaikan semua misi Pulau Logika.',       color:'#E8E0FA', icon:'logika',   progress: s => [s.perIsland.logika.done, s.perIsland.logika.total] },
    { id:'kode',     name:'Ahli Kode',         desc:'Selesaikan semua misi Pulau Kode.',         color:'#D3E3FB', icon:'kode',     progress: s => [s.perIsland.kode.done, s.perIsland.kode.total] },
    { id:'bahasa',   name:'Jago Bahasa',       desc:'Selesaikan semua misi Pulau Bahasa.',       color:'#FAD9E2', icon:'bahasa',   progress: s => [s.perIsland.bahasa.done, s.perIsland.bahasa.total] },
    { id:'kebiasaan',name:'Anak Rajin',        desc:'Selesaikan semua misi Pulau Kebiasaan.',    color:'#FFDFC4', icon:'kebiasaan',progress: s => [s.perIsland.kebiasaan.done, s.perIsland.kebiasaan.total] },
    { id:'hijaiyah', name:'Sahabat Hijaiyah',  desc:'Selesaikan semua misi Pulau Hijaiyah.',     color:'#CDEDEA', icon:'hijaiyah', progress: s => [s.perIsland.hijaiyah.done, s.perIsland.hijaiyah.total] },
    { id:'pulau',    name:'Penjelajah Pulau',  desc:'Mainkan minimal 1 misi di setiap pulau.',   color:'#BDE7F5', icon:'star',     progress: s => [TIQO_CONFIG.islands.filter(i => s.perIsland[i.id].done > 0).length, TIQO_CONFIG.islands.length] },
    { id:'harian',   name:'Rajin Bertualang',  desc:'Selesaikan 3 Misi Hari Ini.',               color:'#FFE08A', icon:'star',     progress: s => [Math.min(s.dailyCount, 3), 3] },
    { id:'sempurna', name:'Bintang Sempurna',  desc:'Dapatkan 3 bintang di 5 misi.',             color:'#F9D3E0', icon:'star',     progress: s => [Math.min(s.perfect, 5), 5] },
    { id:'kolektor', name:'Kolektor Bintang',  desc:'Kumpulkan 25 bintang.',                     color:'#E8E0FA', icon:'star',     progress: s => [Math.min(s.stars, 25), 25] },
    { id:'setia',    name:'Teman Setia',       desc:'Bermain di 5 hari yang berbeda.',           color:'#DDF1D8', icon:'star',     progress: s => [Math.min(s.days, 5), 5] },
    { id:'cemerlang',name:'Bintang Cemerlang', desc:'Kumpulkan 60 bintang.',                     color:'#FFE8A3', icon:'star',     progress: s => [Math.min(s.stars, 60), 60] }
  ];

  // Periksa hadiah baru; simpan tanggal perolehan. Mengembalikan hadiah yang baru didapat.
  async function checkBadges(pid) {
    const s = summary(pid), fresh = [];
    BADGES.forEach(b => { const [c, t] = b.progress(s); if (c >= t && !s.pr.badges[b.id]) { s.pr.badges[b.id] = U.todayKey(); fresh.push(b); } });
    if (fresh.length) await Store.saveProgress(pid);
    return fresh;
  }
  function badgeIcon(b) {
    return b.icon === 'star' ? `<svg viewBox="0 0 100 100"><polygon points="${Art.starPts(50, 54, 40, 19)}" fill="#FFD45C" stroke="#E9A422" stroke-width="5" stroke-linejoin="round"/></svg>`.replace(/^<svg[^>]*>|<\/svg>$/g, '')
      : `<g>${Art.islandIcon(b.icon).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`;
  }

  // Misi Hari Ini: dipilih otomatis per profil per tanggal dan tetap sama sepanjang hari.
  function daily(pid) {
    const pr = Store.progressOf(pid), today = U.todayKey(), prof = Store.profiles.find(p => p.id === pid);
    if (!pr.dailyPick || pr.dailyPick.date !== today || !missionById(pr.dailyPick.missionId)) {
      const lv = prof?.age === '4' ? [1] : prof?.age === '5-6' ? [2, 1] : [1, 2];
      let pool = MISSIONS.filter(m => lv.includes(m.level));
      const fresh = pool.filter(m => !pr.missions[m.id]);
      const notYesterday = (fresh.length ? fresh : pool).filter(m => m.id !== pr.dailyPick?.missionId);
      pool = notYesterday.length ? notYesterday : pool;
      if (prof?.age === '5-6' && fresh.some(m => m.level === 2)) pool = pool.filter(m => m.level === 2).length ? pool.filter(m => m.level === 2) : pool;
      const m = pool[U.hash(today + pid) % pool.length];
      pr.dailyPick = { date: today, missionId: m.id };
      Store.saveProgress(pid);
    }
    return { mission: missionById(pr.dailyPick.missionId), done: !!pr.daily[today] };
  }

  const fits = (m, prof) => !prof || prof.age === 'semua' || (prof.age === '4' ? m.level === 1 : m.level === 2);

  // Misi berikutnya setelah misi tertentu (untuk tombol "Lanjut Bertualang")
  function nextMission(pid, afterId) {
    const pr = Store.progressOf(pid), idx = MISSIONS.findIndex(m => m.id === afterId);
    const order = [...MISSIONS.slice(idx + 1), ...MISSIONS.slice(0, idx + 1)];
    return order.find(m => !pr.missions[m.id] && m.island === MISSIONS[idx].island)
        || order.find(m => !pr.missions[m.id])
        || order[0];
  }

  return { starsFor, summary, BADGES, checkBadges, badgeIcon, daily, nextMission, fits };
})();

/* =========================================================
   8b. WAKTU BERMAIN (diatur orang tua)
   - Batas waktu harian, berlaku untuk SETIAP profil anak.
   - Jam tidur: setelah jam ini (sampai 05.00) TIQO istirahat.
   - Waktu dihitung hanya saat TIQO terbuka di layar anak
     (bukan Area Orang Tua, bukan saat aplikasi di latar belakang).
   - Bila waktu habis di tengah misi, anak boleh menyelesaikan
     misinya dulu (maksimal 5 menit tambahan), lalu istirahat.
   Data disimpan di perangkat (localStorage "tiqo:usage").
   ========================================================= */
const PlayTime = (() => {
  const KEY = 'tiqo:usage', GRACE = 5 * 60, WARN = 2 * 60;
  const LIMITS = [0, 15, 20, 30, 45, 60];          // menit; 0 = tanpa batas
  const BEDTIMES = [0, 19, 20, 21];                // jam; 0 = mati
  let data = {}, last = Date.now(), dirty = 0, warnedFor = '', started = false, bannerAt = 0;

  const load = () => { try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} dirty = 0; };
  function rec(pid, date = U.todayKey()) {
    const p = data[pid] || (data[pid] = {});
    if (!p[date]) {
      p[date] = { s: 0, b: 0 };
      const keys = Object.keys(p).sort(); while (keys.length > 14) delete p[keys.shift()]; // simpan 14 hari terakhir
    }
    return p[date];
  }

  const limitMin = () => Number(Store.settings.playLimit) || 0;
  const bedHour = () => Number(Store.settings.bedtime) || 0;
  function isBedtime(d = new Date()) { const b = bedHour(); if (!b) return false; const h = d.getHours(); return h >= b || h < 5; }

  function status(pid) {
    const r = rec(pid), lim = limitMin() * 60;
    const allowed = lim ? lim + r.b : Infinity;
    const remaining = allowed - r.s;
    return { used: r.s, bonus: r.b, limit: lim, remaining, over: lim ? -remaining : 0,
      reason: isBedtime() ? 'bedtime' : (lim && remaining <= 0 ? 'limit' : null) };
  }
  const blocked = pid => status(pid).reason;

  // Rute yang tidak dihitung dan tetap boleh dibuka saat waktu habis
  const route = () => (location.hash || '#/home').slice(1).split('?')[0];
  const free = r => r === '/parent' || r === '/rest' || r === '/who';

  function tick() {
    const now = Date.now(), dt = Math.min(10, (now - last) / 1000); last = now;
    if (document.visibilityState !== 'visible' || !U.$('#view > *')) return;
    const r = route(), prof = Store.active(); if (!prof || free(r)) return;
    const st0 = status(prof.id);
    if (st0.reason && !r.startsWith('/play')) { if (r !== '/result') App.go('/rest', true); return; }
    rec(prof.id).s += dt; if ((dirty += dt) >= 20) save();
    const st = status(prof.id);
    // Peringatan lembut 2 menit sebelum habis
    if (st.limit && st.remaining > 0 && st.remaining <= WARN && warnedFor !== prof.id + U.todayKey()) {
      warnedFor = prof.id + U.todayKey();
      UI.toast('⏰ 2 menit lagi waktu bermainmu, ya!', 4000); Sound.say('Dua menit lagi waktu bermainmu, ya!');
    }
    if (st.reason) {
      if (r.startsWith('/play')) {
        if (!U.$('.time-banner')) {
          bannerAt = now;
          document.body.appendChild(U.h('<div class="time-banner" role="status">⏰ Waktu habis. Selesaikan misi ini dulu, ya!</div>'));
          Sound.say('Waktu bermain sudah habis. Selesaikan misi ini dulu, ya!');
        }
        if (now - bannerAt > GRACE * 1000) App.go('/rest', true);
      } else if (r !== '/result') App.go('/rest', true);
    }
  }

  function addBonus(pid, minutes) { rec(pid).b += minutes * 60; save(); }
  function usedToday(pid) { return rec(pid).s; }
  const fmt = sec => { const m = Math.floor(sec / 60); return m < 1 ? 'kurang dari 1 menit' : `${m} menit`; };

  function start() {
    if (started) return; started = true; load();
    setInterval(tick, 5000);
    document.addEventListener('visibilitychange', () => { last = Date.now(); if (document.visibilityState === 'hidden') save(); });
    window.addEventListener('pagehide', save);
  }

  /* ---- Layar istirahat ---- */
  function restScreen() {
    const prof = Store.active(), st = status(prof.id);
    if (!st.reason) return App.redirect('/home');
    U.$$('.time-banner').forEach(x => x.remove()); U.$$('.toast.show').forEach(x => x.classList.remove('show'));
    const night = st.reason === 'bedtime';
    const title = night ? 'Sudah Malam!' : 'Waktunya Istirahat!';
    const msg = night ? 'Waktunya tidur supaya besok segar. Sampai jumpa besok pagi, ya!'
                      : 'Kamu sudah bermain dengan hebat hari ini. Besok kita bertualang lagi, ya!';
    const el = U.h(`<main class="screen no-nav rest">
      <div class="rest-sky" aria-hidden="true">
        <svg viewBox="0 0 120 60"><path d="M92 6 a16 16 0 1 0 14 24 a12 12 0 1 1 -14 -24z" fill="#FFE08A"/>
        ${[[14,14],[34,30],[58,10],[74,34],[110,46]].map(([x, y]) => `<polygon points="${Art.starPts(x, y, 3.4, 1.5)}" fill="#fff" opacity=".9"/>`).join('')}</svg>
      </div>
      <div class="rest-m">${Art.mascot('senang')}</div>
      <h1>${title}</h1>
      <p class="rest-msg">${U.esc(msg)}</p>
      <div class="card rest-card">
        <div class="avatar">${U.esc(prof.avatar)}</div>
        <div><b>${U.esc(prof.nickname)}</b><span>Bermain hari ini: ${fmt(st.used)}</span></div>
      </div>
      <p class="rest-tip">${night ? '🌙' : '☀️'} ${night ? 'Selamat tidur. Jangan lupa berdoa sebelum tidur!' : 'Ayo istirahatkan mata, minum air, dan bermain di luar.'}</p>
      <button class="btn btn-soft btn-sm rest-parent" data-act="parent">${Art.I.parent} Orang Tua</button>
    </main>`);
    setTimeout(() => Sound.say(title + ' ' + msg), 300);
    return { el };
  }

  return { start, status, blocked, addBonus, usedToday, fmt, restScreen, isBedtime, LIMITS, BEDTIMES, _tick: tick, _rec: rec };
})();

/* =========================================================
   9. MESIN PERMAINAN
   Menjalankan satu misi: menampilkan tantangan satu per satu,
   memberi umpan balik, menghitung nilai, lalu memanggil onFinish.
   Jenis tantangan: choice | order | findAll | memory
   ========================================================= */
const Engine = (() => {
  const PRAISE = ['Hebat! Kamu berhasil!', 'Wah, pintar sekali!', 'Benar! Kamu keren!', 'Mantap! Kamu menemukan bintang!', 'Yey, betul sekali!'];
  const RETRY = ['Ayo, kita coba lagi!', 'Sedikit lagi, kamu pasti bisa!', 'Hampir! Coba yang lain, ya.'];

  function run(root, mission, { onFinish, onExit }) {
    const rounds = buildRounds(mission);
    const scores = [];
    let i = 0, alive = true, timers = [], disposers = [];
    const dispose = () => disposers.splice(0).forEach(f => { try { f(); } catch (e) {} });
    const later = (fn, ms) => { const t = setTimeout(() => alive && fn(), ms); timers.push(t); return t; };

    root.innerHTML = `
      <div class="play">
        <div class="play-top">
          <button class="icon-btn" data-act="exit" aria-label="Berhenti bermain">${Art.I.close}</button>
          <div class="progress" aria-hidden="true">${rounds.map(() => '<i></i>').join('')}</div>
          <button class="icon-btn" data-act="say" aria-label="Dengarkan instruksi">${Art.I.sound}</button>
        </div>
        <div class="play-body"></div>
      </div>
      <div class="fb" role="status" aria-live="polite"></div>`;
    const spoken = r => r.voice || r.say;
    const body = U.$('.play-body', root), fb = U.$('.fb', root), bars = U.$$('.progress i', root);

    root.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'say') { Sound.say(spoken(rounds[i])); }
      if (b.dataset.act === 'exit') confirmExit();
    });

    function confirmExit() {
      Sound.stop();
      UI.modal({ title: 'Mau berhenti dulu?', body: `<div style="display:flex;align-items:center;gap:12px"><div style="width:72px;flex:none">${Art.mascot('penasaran')}</div><p style="margin:0">Progres misi ini belum tersimpan. Kita bisa main lagi nanti!</p></div>`,
        actions: [{ label: 'Keluar', kind: 'btn-soft', onClick: () => { stop(); onExit(); } }, { label: 'Lanjut Main', kind: 'btn-primary' }] });
    }

    function setBars() { bars.forEach((b, k) => b.className = k < i ? 'done' : k === i ? 'now' : ''); }

    function hideFb() { fb.classList.remove('show'); }
    function showOk(text, sub, onNext) {
      clearTimeout(tryT); // jangan biarkan pewaktu pesan "coba lagi" menutup pesan benar
      Sound.play('right'); U.vibrate(25);
      fb.className = 'fb ok';
      fb.innerHTML = `<div class="m">${Art.mascot(Math.random() < .5 ? 'semangat' : 'kedip')}</div>
        <div class="txt"><b>${U.esc(U.plain(text))}</b>${sub ? `<span>${U.esc(U.plain(sub))}</span>` : ''}</div>
        <button class="btn btn-ok" data-next>Lanjut ${Art.I.next}</button>`;
      requestAnimationFrame(() => fb.classList.add('show'));
      Sound.say(text + (sub ? '. ' + sub : ''));
      const btn = U.$('[data-next]', fb);
      btn.focus({ preventScroll: true });
      btn.onclick = () => { Sound.play('tap'); hideFb(); later(onNext, 180); };
    }
    let tryT;
    function showTry(hint, lines) {
      Sound.play('soft');
      fb.className = 'fb try';
      const line = U.pick(lines || RETRY);
      fb.innerHTML = `<div class="m">${Art.mascot('berpikir')}</div><div class="txt"><b>${U.esc(U.plain(line))}</b><span>${U.esc(U.plain(hint || ''))}</span></div>`;
      requestAnimationFrame(() => fb.classList.add('show'));
      Sound.say(line + ' ' + (hint || ''));
      clearTimeout(tryT); tryT = later(hideFb, 2600);
    }

    function burst(el) {
      const r = el.getBoundingClientRect(), wrap = U.h('<div class="burst"></div>');
      wrap.style.left = r.left + r.width / 2 + 'px'; wrap.style.top = r.top + r.height / 2 + 'px';
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * Math.PI * 2, d = 50 + Math.random() * 30;
        const s = U.h(`<i>${Art.star(true)}</i>`); s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        wrap.appendChild(s);
      }
      document.body.appendChild(wrap); setTimeout(() => wrap.remove(), 900);
    }

    function header(r) {
      return `<div class="instr"><div class="m">${Art.mascot(r.kind === 'memory' ? 'penasaran' : r.kind === 'trace' ? 'semangat' : r.kind === 'code' ? 'penasaran' : 'senang')}</div><div class="bubble">${U.esc(U.plain(r.say))}</div></div>
              ${r.prompt ? `<div class="prompt">${r.prompt}</div>` : ''}`;
    }

    function next() {
      if (!alive) return;
      if (i >= rounds.length) return finish();
      dispose();
      setBars();
      const r = rounds[i];
      body.innerHTML = header(r);
      body.style.animation = 'none'; void body.offsetWidth; body.style.animation = 'fadeUp .3s ease both';
      ({ choice: doChoice, order: doOrder, findAll: doFind, memory: doMemory, trace: doTrace, code: doCode })[r.kind](r);
      later(() => Sound.say(spoken(r)), 250);
      // Fitur bantu hitung: sentuh benda untuk memberi nomor
      let cnt = 0;
      U.$$('[data-count]', body).forEach(b => b.addEventListener('click', () => {
        if (b.querySelector('.n')) return;
        cnt++; b.insertAdjacentHTML('beforeend', `<span class="n">${cnt}</span>`);
        Sound.play('tap'); Sound.say(CONTENT.NUM_WORDS[cnt] || String(cnt));
      }));
    }
    function done(score, okText, sub) {
      scores.push(score);
      i++; setBars();
      showOk(okText || U.pick(PRAISE), sub, next);
    }

    /* ---- Pilihan ganda ---- */
    function doChoice(r) {
      const box = U.h(`<div class="options" style="--cols:${r.cols || 3}"></div>`);
      let tries = 0, locked = false;
      r.options.forEach(o => {
        const b = U.h(`<button class="opt ${o.cls || ''}" aria-label="${U.esc(o.name || 'pilihan')}">${o.html}</button>`);
        b.onclick = () => {
          if (locked || b.classList.contains('dim')) return;
          tries++;
          if (o.correct) {
            locked = true; b.classList.remove('glow'); b.classList.add('right'); burst(b);
            U.$$('.opt', box).forEach(x => x !== b && x.classList.add('dim'));
            const sub = r.reveal || (o.reveal ? `Ini ${o.reveal}` : '');
            done(tries === 1 ? 1 : tries === 2 ? .5 : .2, null, sub);
          } else {
            b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong', 'dim');
            showTry(r.hint);
            if (tries >= 2) U.$$('.opt', box).forEach((x, k) => r.options[k].correct && x.classList.add('glow'));
          }
        };
        box.appendChild(b);
      });
      body.appendChild(box);
    }

    /* ---- Mengurutkan ---- */
    function doOrder(r) {
      const slots = U.h(`<div class="order-slots ${r.steps ? 'steps' : ''}">${r.answer.map((_, k) => `<span class="slot">${r.steps ? `<small>${k + 1}</small>` : ''}</span>`).join('')}</div>`);
      const pool = U.h(`<div class="order-pool ${r.steps ? 'steps' : ''}"></div>`);
      let pos = 0, miss = 0;
      r.items.forEach(it => {
        const b = U.h(`<button class="order-item ${r.steps ? 'step' : ''}" aria-label="${U.esc(it.name || 'Angka ' + it.value)}">${it.html}</button>`);
        b.onclick = () => {
          if (b.classList.contains('used')) return;
          if (it.value === r.answer[pos]) {
            const s = slots.children[pos]; s.classList.add('filled'); s.innerHTML = it.slotHtml || it.html;
            b.classList.add('used'); Sound.play('tap'); if (!r.steps || pos + 1 < r.answer.length) Sound.say(it.say || CONTENT.NUM_WORDS[it.value] || String(it.value));
            pos++;
            if (pos === r.answer.length) done(miss === 0 ? 1 : miss <= 2 ? .5 : .2, null, r.reveal || 'Urutannya sudah benar');
          } else {
            miss++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); showTry(r.steps && pos > 0 ? 'Langkah apa yang dilakukan setelah itu?' : r.hint);
          }
        };
        pool.appendChild(b);
      });
      body.appendChild(slots); body.appendChild(pool);
    }

    /* ---- Temukan semua ---- */
    function doFind(r) {
      const need = r.items.filter(x => x.correct).length;
      const counter = U.h(`<div class="find-count" aria-label="Ditemukan">${Array.from({ length: need }, () => Art.star(false)).join('')}</div>`);
      const grid = U.h(`<div class="find-grid" style="grid-template-columns:repeat(${r.cols || 4},1fr)"></div>`);
      let found = 0, miss = 0;
      r.items.forEach(it => {
        const b = U.h(`<button class="find-item" aria-label="${U.esc(it.name || '')}">${it.html}</button>`);
        b.onclick = () => {
          if (b.classList.contains('found')) return;
          if (it.correct) {
            b.classList.add('found'); burst(b); Sound.play('star');
            counter.children[found].outerHTML = Art.star(true); found++;
            if (found === need) done(miss === 0 ? 1 : miss <= 2 ? .5 : .2, null, 'Semua sudah ditemukan');
          } else {
            miss++; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); showTry(r.hint);
          }
        };
        grid.appendChild(b);
      });
      body.appendChild(counter); body.appendChild(grid);
    }

    /* ---- Kartu memori ---- */
    function doMemory(r) {
      const grid = U.h(`<div class="memory" style="--cols:${r.cols}"></div>`);
      const pairs = r.cards.length / 2;
      let open = [], matched = 0, miss = 0, busy = false;
      r.cards.forEach((c, k) => {
        const b = U.h(`<button class="mcard" aria-label="Kartu ${k + 1}"><span class="inner"><span class="face back"><img src="${ASSETS.q}" alt=""></span><span class="face front">${c.html}</span></span></button>`);
        b.onclick = () => {
          if (busy || b.classList.contains('open') || b.classList.contains('matched')) return;
          b.classList.add('open'); Sound.play('flip'); if (c.voice) Sound.say(c.voice); open.push({ b, c });
          if (open.length === 2) {
            busy = true;
            const [x, y] = open;
            if (x.c.key === y.c.key) {
              later(() => { x.b.classList.add('matched'); y.b.classList.add('matched'); Sound.play('star'); burst(y.b);
                open = []; busy = false; matched++;
                if (matched === pairs) later(() => done(miss <= pairs ? 1 : miss <= pairs * 2 ? .6 : .3, 'Hebat! Semua pasangan ketemu!'), 400);
              }, 350);
            } else {
              miss++;
              later(() => { x.b.classList.add('wrong'); y.b.classList.add('wrong'); }, 500);
              later(() => { x.b.classList.remove('open', 'wrong'); y.b.classList.remove('open', 'wrong'); open = []; busy = false; }, 1100);
            }
          }
        };
        grid.appendChild(b);
      });
      body.appendChild(grid);
    }

    /* ---- Menebalkan dengan jari ---- */
    function doTrace(r) {
      const host = U.h('<div class="trace-host"></div>');
      body.appendChild(host);
      const w = Trace.mount(host, r, {
        onOff: () => showTry(r.hint, ['Ups, keluar jalur. Ayo coba lagi!', 'Pelan-pelan saja, kamu pasti bisa!', 'Sedikit lagi, ikuti titiknya ya!']),
        onPart: () => Sound.play('star'),
        onDone: (score, pad) => { Sound.play('star'); burst(pad); later(() => done(score, null, r.reveal), 650); }
      });
      disposers.push(w.destroy);
    }

    /* ---- Pulau Kode ---- */
    function doCode(r) {
      const host = U.h('<div class="code-host"></div>');
      body.appendChild(host);
      const w = Code.mount(host, r, {
        onFail: msg => showTry(r.hint, [msg]),
        onDone: (score, board) => { Sound.play('star'); burst(board); later(() => done(score, 'Hebat! Kodemu berhasil!', ''), 700); }
      });
      disposers.push(w.destroy);
    }

    function finish() {
      stop();
      onFinish({ mission, scores, stars: Rewards.starsFor(scores), rounds: rounds.length });
    }
    function stop() { alive = false; timers.forEach(clearTimeout); dispose(); Sound.stop(); }

    next();
    return { stop };
  }
  return { run };
})();

        ${r.stars > r.before && r.before > 0 ? `<div class="row"><span class="ico" style="background:var(--mint)">📈</span><div><b>Rekor baru!</b><br><small style="color:var(--ink-2);font-weight:700">Sebelumnya ${r.before} bintang.</small></div></div>` : ''}
      </div>
      <div class="actions">
        <button class="btn btn-primary btn-block" data-go="/play/${nx.id}">${Art.I.next} Lanjut Bertualang</button>
        <div class="two">
          <button class="btn btn-white" data-go="/play/${m.id}">${Art.I.replay} Main Lagi</button>
          <button class="btn btn-white" data-go="/map">${Art.I.map} Ke Peta</button>
        </div>
      </div>
    </main>`);
    // Animasi bintang & konfeti
    const ss = U.$$('.result-stars .s', el).filter(s => !s.classList.contains('off'));
    ss.forEach((s, k) => setTimeout(() => { s.classList.add('in'); Sound.play('star'); }, 450 + k * 380));
    setTimeout(() => { Sound.play('win'); Sound.say(title + ' ' + msg + (r.badges.length ? ' Kamu mendapat hadiah baru!' : '')); }, 150);
    const cf = h('<div class="confetti" aria-hidden="true"></div>');
    const cols = ['#FFD45C', '#B9A3EE', '#6CC6EC', '#8ED8C6', '#F7A6C4'];
    for (let k = 0; k < 36; k++) {
      const c = document.createElement('i');
      c.style.left = Math.random() * 100 + '%'; c.style.background = U.pick(cols);
      c.style.animationDuration = 2 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * .8 + 's';
      cf.appendChild(c);
    }
    el.appendChild(cf); setTimeout(() => cf.remove(), 5000);
    return { el };
  }

  /* ---------------- Galeri Bintang ---------------- */
  function gallery() {
    const p = prof(), s = Rewards.summary(p.id);
    const el = h(`<main class="screen">
      ${topbar()}
      <div class="gallery-head">${Art.star(true, 'big-star')}<div><h1>Galeri Bintang</h1><p>${s.stars} bintang · ${Object.keys(s.pr.badges).length} dari ${Rewards.BADGES.length} hadiah</p></div></div>
      <div class="badge-grid">
        ${Rewards.BADGES.map(b => {
          const [c, t] = b.progress(s), got = !!s.pr.badges[b.id];

            ${Art.medal(b.color, Rewards.badgeIcon(b))}<b>${esc(b.name)}</b>
            <small>${got ? '✓ Didapat ' + U.fmtDate(s.pr.badges[b.id]) : esc(b.desc)}</small>
            ${got ? '' : `<span class="meter" aria-hidden="true"><i style="width:${Math.round(c / t * 100)}%"></i></span><small>${c}/${t}</small>`}
          </button>`;
        }).join('')}
      </div>
    </main>`);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-badge]'); if (!b) return;
      const bd = Rewards.BADGES.find(x => x.id === b.dataset.badge), got = !!s.pr.badges[bd.id];
      Sound.say(bd.name + '. ' + (got ? 'Kamu sudah mendapatkannya. Hebat!' : bd.desc));
    });
    return { el, nav: 'gallery' };
  }

  return { home, who, map, island, play, result, gallery };
})();

/* =========================================================
   11. AREA ORANG TUA
   Dilindungi gerbang orang tua (soal hitungan + tahan tombol).
   Catatan: gerbang ini mencegah anak masuk tanpa sengaja,
   BUKAN pengganti login yang aman untuk fitur daring.
   ========================================================= */
const Parent = (() => {
  const { esc, h } = U;
  const AVATARS = ['🐥', '🐱', '🐰', '🦊', '🐼', '🐻', '🐸', '🦁', '🐨', '🐯', '🐶', '🐳'];
  const AGE_LABEL = { '4': 'Usia 4 tahun', '5-6': 'Usia 5–6 tahun', 'semua': 'Semua tingkat' };

  /* ---- Gerbang orang tua ---- */
  function gate(onPass) {
    let a, b, ans = '';
    const roll = () => { a = U.ri(11, 19); b = U.ri(4, 9); ans = ''; };
    roll();
    const body = h(`<div>
      <p style="margin:0">Bagian ini untuk orang tua atau guru. Jawab soal berikut:</p>
      <div class="gate-q"></div><div class="gate-ans" aria-live="polite"></div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="Hapus">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--primary);color:#fff">OK</button></div>
      <div class="hold-step" hidden><p style="margin:14px 0 10px">Benar. Sekarang <b>tahan tombol</b> di bawah selama 2 detik.</p>
        <button class="hold"><i></i><span>Tahan untuk masuk</span></button></div>
    </div>`);
    const q = U.$('.gate-q', body), out = U.$('.gate-ans', body), pad = U.$('.keypad', body), holdStep = U.$('.hold-step', body);
    const paint = () => { q.textContent = `${a} + ${b} = ?`; out.textContent = ans || '–'; };
    paint();
    const md = UI.modal({ title: 'Area Orang Tua', body, actions: [{ label: 'Kembali', kind: 'btn-soft' }] });
    pad.addEventListener('click', e => {
      const k = e.target.closest('[data-k]')?.dataset.k; if (!k) return;
      if (k === 'del') ans = ans.slice(0, -1);
      else if (k === 'ok') {
        if (Number(ans) === a + b) { pad.hidden = true; out.hidden = true; q.hidden = true; holdStep.hidden = false; }
        else { UI.toast('Belum tepat. Coba soal baru.'); roll(); }
      } else if (ans.length < 3) ans += k;
      paint();
    });
    const hold = U.$('.hold', body), bar = U.$('i', hold);
    let t0 = 0, raf = 0;
    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / 2000); bar.style.width = p * 100 + '%';
      if (p >= 1) { md.close(); App.session.parentUntil = Date.now() + 10 * 60 * 1000; onPass(); return; }
      raf = requestAnimationFrame(tick);
    };
    const start = e => { e.preventDefault(); t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
    const end = () => { cancelAnimationFrame(raf); bar.style.width = '0'; };
    hold.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hold.addEventListener(ev, end));
    hold.addEventListener('contextmenu', e => e.preventDefault());
  }
  const unlocked = () => (App.session.parentUntil || 0) > Date.now();
  function open() { if (unlocked()) App.go('/parent'); else gate(() => App.go('/parent')); }

  /* ---- Formulir profil ---- */
  function profileForm(existing) {
    const st = { nickname: existing?.nickname || '', avatar: existing?.avatar || U.pick(AVATARS), age: existing?.age || 'semua' };
    const body = h(`<div>
      <label class="field"><span>Nama panggilan (boleh nama samaran)</span><input type="text" maxlength="20" placeholder="Contoh: Adik" value="${esc(st.nickname)}"></label>
      <div class="field"><span>Pilih gambar</span><div class="avatar-pick">${AVATARS.map(a => `<button type="button" data-av="${a}" class="${a === st.avatar ? 'on' : ''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div></div>
      <div class="field"><span>Tingkat permainan</span><div class="seg">${Object.entries(AGE_LABEL).map(([k, v]) => `<button type="button" data-age="${k}" class="${k === st.age ? 'on' : ''}">${v}</button>`).join('')}</div></div>
      <p class="note">Kami tidak meminta nama lengkap, tanggal lahir, foto, atau data pribadi lain.</p>
    </div>`);

      { label: 'Batal', kind: 'btn-soft' },

  /* ---- Kartu waktu bermain ---- */

          <div class="acts">${st.limit ? `<button data-bonus="${p.id}" aria-label="Tambah 10 menit untuk ${esc(p.nickname)}">+10 menit</button>` : ''}</div></div>`;
      }).join('')}</div>
      <p class="note">Waktu dihitung hanya saat TIQO terbuka di layar anak. Dua menit sebelum habis, maskot mengingatkan anak. Jika waktu habis di tengah misi, anak boleh menyelesaikan misinya dulu. Tambahan waktu hanya berlaku hari ini${bed ? ', dan tidak berlaku pada jam tidur' : ''}.</p>

      if ('import' in d) U.$('#imp', el).click();
    });
    U.$('#imp', el).addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const data = JSON.parse(await f.text());
        if (!(await UI.confirm('Pulihkan cadangan?', 'Data yang ada sekarang di perangkat ini akan diganti dengan isi berkas cadangan.', 'Pulihkan'))) return;
        await Store.importAll(data); UI.toast('Cadangan berhasil dipulihkan'); App.render();
      } catch (err) { UI.toast(err.message && err.message.length < 80 ? err.message : 'Berkas tidak dapat dibaca'); }
      e.target.value = '';
    });
    return { el };
  }

  return { open, screen };
})();

/* =========================================================
   12. RUTE, LAYAR PEMBUKA, DAN START APLIKASI
   Rute memakai hash (#/home) agar berjalan di hosting statis
   seperti Vercel tanpa konfigurasi tambahan.
   ========================================================= */
const App = (() => {
  const view = () => U.$('#view');
  let current = null, redirected = null;
  const session = { chosen: false, parentUntil: 0 };

  const ROUTES = [
    [/^\/home$/, () => Screens.home()],
    [/^\/who$/, () => Screens.who()],
    [/^\/map$/, () => Screens.map()],
    [/^\/gallery$/, () => Screens.gallery()],
    [/^\/island\/([\w-]+)$/, m => Screens.island({ id: m[1] })],
    [/^\/play\/([\w-]+)$/, (m, q) => Screens.play({ id: m[1] }, q)],
    [/^\/result$/, () => Screens.result()],
    [/^\/parent$/, () => Parent.screen()],
    [/^\/rest$/, () => PlayTime.restScreen()]
  ];

  function parse() {
    const raw = (location.hash || '#/home').slice(1);
    const [path, qs] = raw.split('?');
    return { path: path || '/home', q: new URLSearchParams(qs || '') };
  }
  function go(path, replace) {
    const target = '#' + path;
    if (location.hash === target) { render(); return; }
    if (replace) { history.replaceState(null, '', target); render(); } else location.hash = target;
  }
  function redirect(path) { redirected = path; return null; }

  function render() {
    redirected = null;
    if (current?.cleanup) { try { current.cleanup(); } catch (e) {} }
    Sound.stop();
    U.$$('.modal-wrap,.fb,.burst,.confetti').forEach(x => { if (!x.closest('#view')) x.remove(); });
    let { path, q } = parse();
    if (Store.profiles.length > 1 && !session.chosen && path !== '/who' && path !== '/parent') path = '/who';
    // Waktu bermain habis / jam tidur → layar istirahat (Area Orang Tua & hasil misi tetap boleh dibuka)
    if (path !== '/who' && Store.active() && PlayTime.blocked(Store.active().id) && !['/parent', '/rest', '/result'].includes(path)) {
      path = '/rest'; history.replaceState(null, '', '#/rest');
    }
    if (!path.startsWith('/play')) U.$$('.time-banner').forEach(x => x.remove());
    let res = null;
    for (const [re, fn] of ROUTES) { const m = path.match(re); if (m) { res = fn(m, q); break; } }
    if (!res) { if (redirected) return go(redirected, true); return go('/home', true); }
    current = res;
    view().replaceChildren(res.el);
    window.scrollTo(0, 0);
    // Navigasi bawah
    const nav = U.$('.bottom-nav');
    nav.hidden = !res.nav;
    U.$$('a', nav).forEach(a => a.classList.toggle('on', a.dataset.nav === res.nav));
    const h1 = U.$('h1', res.el); document.title = h1 ? `${h1.textContent} · TIQO` : 'TIQO';
  }

  // Klik global: data-go → pindah halaman, data-act="parent" → gerbang orang tua
  document.addEventListener('click', e => {
    Sound.unlock();
    const g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); Sound.play('tap'); go(g.dataset.go); return; }
    const a = e.target.closest('[data-act="parent"]');
    if (a) { Sound.play('tap'); Parent.open(); }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installEvt = e; });

  return { go, render, redirect, session, lastResult: null, installEvt: null };
})();

/* ---- Layar pembuka & start ---- */
(async function boot() {
  const splash = U.$('.splash');
  const t0 = Date.now();
  splash.querySelector('.logo').src = ASSETS.logo;
  try {
    await Store.init();
  } catch (e) {
    console.error(e);
    UI.toast('Penyimpanan tidak tersedia. Progres mungkin tidak tersimpan.', 4000);
  }
  // Kartu sekolah (dapat diatur orang tua)
  const S = Store.settings;
  if (S.showSchool && (S.schoolName || S.schoolLine)) {
    splash.querySelector('.school').innerHTML = `${S.schoolLine ? `<div class="l1">${U.esc(S.schoolLine)}</div>` : ''}${S.schoolName ? `<div class="l2">${U.esc(S.schoolName)}</div>` : ''}`;
  }
  const finish = () => {
    if (splash.classList.contains('hide')) return;
    splash.classList.add('hide'); setTimeout(() => splash.remove(), 600);
  };
  if (Store.profiles.length <= 1) App.session.chosen = true;
  PlayTime.start();
  // Saat aplikasi dibuka ulang, jangan langsung masuk area orang tua atau halaman hasil
  if (/^#\/(parent|result)/.test(location.hash)) history.replaceState(null, '', '#/home');
  App.render();
  splash.addEventListener('click', finish);
  setTimeout(finish, Math.max(0, TIQO_CONFIG.splashMinMs - (Date.now() - t0)));

  // Service worker (hanya aktif bila sw.js ikut diunggah & situs memakai https/localhost)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sw.js belum diunggah: aplikasi tetap jalan normal */ });
  }
})();
window.addEventListener('error', e => console.error('TIQO error:', e.message));
window.addEventListener('unhandledrejection', e => console.error('TIQO promise error:', e.reason));

</script>
