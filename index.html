      for (let k = 1; k < st.length; k++) ix.lineTo(st[k][0], st[k][1]);
    }
    function inkStyle() { ix.lineCap = 'round'; ix.lineJoin = 'round'; ix.lineWidth = isPath ? 10 : 8; ix.strokeStyle = 'rgba(126,98,201,.88)'; }
    function drawInk() {
      ix.save(); ix.setTransform(1, 0, 0, 1, 0, 0); ix.clearRect(0, 0, icv.width, icv.height); ix.restore();
      inkStyle(); strokes.forEach(st => { inkPath(st); ix.stroke(); });
      if (finished) {
        ix.save(); ix.globalCompositeOperation = 'source-in';
        const g = ix.createLinearGradient(0, 0, 100, 100); g.addColorStop(0, '#7E62C9'); g.addColorStop(.5, '#3BA6D8'); g.addColorStop(1, '#2E9E62');
        ix.fillStyle = g; ix.fillRect(0, 0, 100, 100); ix.restore();
      }
    }

    const pos = e => { const b = icv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * 100, (e.clientY - b.top) / b.height * 100]; };
    function addPoint(p) {
      const last = active[active.length - 1];
      const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
      if (d < .6) return;
      const n = Math.ceil(d / 2);
      for (let k = 1; k <= n; k++) active.push([last[0] + (p[0] - last[0]) * k / n, last[1] + (p[1] - last[1]) * k / n]);
      inkStyle(); ix.beginPath(); ix.moveTo(last[0], last[1]); ix.lineTo(p[0], p[1]); ix.stroke();
    }
    function down(e) {
      if (!ready || finished || activeId !== null) return;
      e.preventDefault(); Sound.unlock();
      try { icv.setPointerCapture(e.pointerId); } catch (er) {}
      activeId = e.pointerId; active = [pos(e)]; strokes.push(active);
      inkStyle(); inkPath(active); ix.stroke();
    }
    function move(e) {
      if (e.pointerId !== activeId || !active) return;
      e.preventDefault();
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      (evs.length ? evs : [e]).forEach(ev => addPoint(pos(ev)));
    }
    function up(e) {
      if (e.pointerId !== activeId) return;
      const st = active; active = null; activeId = null;
      evaluate(st);
    }

    const near = (p, tol2) => { for (const t of flat) { const dx = t[0] - p[0], dy = t[1] - p[1]; if (dx * dx + dy * dy <= tol2) return true; } return false; };
    function evaluate(st) {
      let len = 0; for (let k = 1; k < st.length; k++) len += Math.hypot(st[k][0] - st[k - 1][0], st[k][1] - st[k - 1][1]);
      const far = st.filter(p => !near(p, OFF * OFF)).length / st.length;
      if ((len > 12 && far > .45) || (len <= 12 && far === 1)) {
        strokes.pop(); drawInk(); offCount++;
        pad.classList.remove('shake'); void pad.offsetWidth; pad.classList.add('shake');
        cb.onOff && cb.onOff(); return;
      }
      const T2 = TOL * TOL; let changed = false;
      groups.forEach((g, gi) => {
        if (done[gi]) return;
        g.forEach((t, ti) => {
          if (cov[gi][ti]) return;
          for (const p of st) { const dx = t[0] - p[0], dy = t[1] - p[1]; if (dx * dx + dy * dy <= T2) { cov[gi][ti] = 1; break; } }
        });
        const frac = cov[gi].reduce((a, b) => a + b, 0) / g.length;
        if (frac >= TH) { done[gi] = true; changed = true; }
      });
      if (done.every(Boolean)) {
        finished = true; drawGuide(); drawInk();
        cb.onDone && cb.onDone(offCount === 0 ? 1 : offCount <= 2 ? .5 : .2, pad);
      } else if (changed) { drawGuide(); cb.onPart && cb.onPart(); }
    }
    function clear() {
      if (finished) return;
      strokes = []; cov = groups.map(g => new Uint8Array(g.length)); done = groups.map(() => false);
      drawGuide(); drawInk(); Sound.play('tap');
    }

    icv.addEventListener('pointerdown', down);
    icv.addEventListener('pointermove', move);
    icv.addEventListener('pointerup', up);
    icv.addEventListener('pointercancel', up);
    icv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    icv.addEventListener('contextmenu', e => e.preventDefault());
    U.$('.t-clear', el).addEventListener('click', clear);
    const onResize = () => { if (!dead) layout(); };
    window.addEventListener('resize', onResize);

    (async () => {
      if (isPath) groups = r.strokes.map(d => samplePath(d));
      else { glyph = await glyphTargets(r.ch); groups = [glyph.pts.length ? glyph.pts : [[50, 50]]]; }
      if (dead) return;
      flat = groups.flat(); cov = groups.map(g => new Uint8Array(g.length)); done = groups.map(() => false);
      ready = true; layout();
    })();
    layout();

    const api = { el, pad, destroy() { dead = true; window.removeEventListener('resize', onResize); },
      _debug: () => ({ groups, done, finished, offCount, rect: icv.getBoundingClientRect() }) };
    Trace._last = api;
    return api;
  }

  return { mount, hasStrokes, strokesOf, STROKES, _last: null };
})();

/* =========================================================
   4c. PULAU KODE — coding untuk anak (tanpa mengetik)
   Anak menyusun kartu panah agar bintang sampai ke portal Q.
   Arah memakai arah mutlak (kanan/kiri/atas/bawah) agar mudah
   dipahami anak 4–6 tahun.
   Mode:
     path : susun langkah (boleh ada batu)
     fix  : kode sudah terisi tetapi ada satu panah yang salah
     loop : slot terbatas, gunakan kartu ×2 / ×3 (perulangan)
   Setiap teka-teki dibuat acak lalu diperiksa dengan BFS
   sehingga PASTI bisa diselesaikan.
   ========================================================= */
const Code = (() => {
  const DIRS = {
    R: { dr: 0, dc: 1, name: 'kanan', rot: 0 },
    D: { dr: 1, dc: 0, name: 'bawah', rot: 90 },
    L: { dr: 0, dc: -1, name: 'kiri', rot: 180 },
    U: { dr: -1, dc: 0, name: 'atas', rot: 270 }
  };
  const ORDER = ['U', 'L', 'R', 'D'];
  const key = (r, c) => r + ',' + c;
  const inB = (n, r, c) => r >= 0 && c >= 0 && r < n && c < n;

  // ---- Pencarian jalur terpendek (BFS) ----
  function bfs(n, start, goal, rocks) {
    const prev = new Map([[key(...start), null]]), q = [start];
    while (q.length) {
      const [r, c] = q.shift();
      if (r === goal[0] && c === goal[1]) {
        const path = []; let k = key(r, c);
        while (prev.get(k)) { const p = prev.get(k); path.unshift(p.d); k = p.from; }
        return path;
      }
      for (const d of U.shuffle(ORDER)) {
        const nr = r + DIRS[d].dr, nc = c + DIRS[d].dc, nk = key(nr, nc);
        if (!inB(n, nr, nc) || rocks.has(nk) || prev.has(nk)) continue;
        prev.set(nk, { from: key(r, c), d }); q.push([nr, nc]);
      }
    }
    return null;
  }
  const rnd = n => [U.ri(0, n - 1), U.ri(0, n - 1)];
  const expand = prog => prog.flatMap(b => Array(b.n || 1).fill(b.d));

  // Jalankan program; kembalikan jejak langkah dan hasil
  function simulate(p, prog) {
    let [r, c] = p.start; const trail = [];
    const steps = expand(prog);
    for (let i = 0; i < steps.length; i++) {
      const d = DIRS[steps[i]], nr = r + d.dr, nc = c + d.dc;
      if (!inB(p.size, nr, nc)) return { trail, end: 'edge', at: [nr, nc] };
      if (p.rocks.has(key(nr, nc))) return { trail, end: 'rock', at: [nr, nc] };
      r = nr; c = nc; trail.push([r, c]);
      if (r === p.goal[0] && c === p.goal[1]) return { trail, end: 'goal' };
    }
    return { trail, end: 'short' };
  }

  // ---- Generator teka-teki ----
  function makePath({ size = 4, len = [2, 3], rocks = [0, 0], detour = false }) {
    for (let t = 0; t < 400; t++) {
      const start = rnd(size), rs = new Set(), k = U.ri(rocks[0], rocks[1]);
      while (rs.size < k) { const x = rnd(size); if (key(...x) !== key(...start)) rs.add(key(...x)); }
      const goal = rnd(size);
      if (key(...goal) === key(...start) || rs.has(key(...goal))) continue;
      const sol = bfs(size, start, goal, rs);
      if (!sol || sol.length < len[0] || sol.length > len[1]) continue;
      if (detour) { // batu harus benar-benar menghalangi jalan lurus
        const man = Math.abs(goal[0] - start[0]) + Math.abs(goal[1] - start[1]);
        const r0 = Math.min(start[0], goal[0]), r1 = Math.max(start[0], goal[0]), c0 = Math.min(start[1], goal[1]), c1 = Math.max(start[1], goal[1]);
        const inBox = [...rs].some(s => { const [a, b] = s.split(',').map(Number); return a >= r0 && a <= r1 && b >= c0 && b <= c1; });
        if (!(sol.length > man || inBox)) continue;
      }
      return { size, start, goal, rocks: rs, solution: sol.map(d => ({ d, n: 1 })) };
    }
    return null;
  }
  function makeLoop({ size = 5, segs = 2 }) {
    for (let t = 0; t < 400; t++) {
      const blocks = []; let last = null;
      for (let i = 0; i < segs; i++) {
        const opts = ORDER.filter(d => !last || (DIRS[d].dr !== 0) !== (DIRS[last].dr !== 0)); // tegak lurus
        const d = U.pick(opts); blocks.push({ d, n: U.ri(2, 3) }); last = d;
      }
      const start = rnd(size); let [r, c] = start; const cells = new Set([key(r, c)]); let ok = true;
      for (const s of expand(blocks)) { r += DIRS[s].dr; c += DIRS[s].dc; if (!inB(size, r, c) || cells.has(key(r, c))) { ok = false; break; } cells.add(key(r, c)); }
      if (!ok) continue;
      const rs = new Set(); let guard = 0;
      while (rs.size < 1 && guard++ < 50) { const x = rnd(size); if (!cells.has(key(...x))) rs.add(key(...x)); }
      return { size, start, goal: [r, c], rocks: rs, solution: blocks };
    }
    return null;
  }
  function makeFix(opts) {
    for (let t = 0; t < 100; t++) {
      const p = makePath(opts); if (!p) continue;
      const prog = p.solution.map(b => ({ ...b })), i = U.ri(0, prog.length - 1);
      prog[i] = { d: U.pick(ORDER.filter(d => d !== prog[i].d)), n: 1 };
      if (simulate(p, prog).end === 'goal') continue;
      return { ...p, prefill: prog };
    }
    return null;
  }

  /* ---- Gambar kecil ---- */
  const arrow = (d, cls = '') => `<svg class="${cls}" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(${DIRS[d].rot} 20 20)">
    <path d="M8 20 H27 M20 11 L29 20 L20 29" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  const rockSvg = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 31 C5 24 9 16 15 13 C19 8 27 9 30 15 C35 18 36 26 33 31 Z" fill="#A89BB8" stroke="#7D7091" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M13 18 C15 15 19 14 21 15" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;

  /* ---- Widget ---- */
  function mount(host, r, cb) {
    const p = r.puzzle, loop = r.mode === 'loop', fix = r.mode === 'fix';
    let prog = (r.mode === 'fix' ? p.prefill : []).map(b => ({ ...b })), sel = -1, running = false, done = false, fails = 0, dead = false;
    const el = U.h(`<div class="code">
      <div class="code-board" style="--n:${p.size}" role="img" aria-label="Papan permainan"></div>
      <div class="code-prog" aria-label="Kode kamu"></div>
      <div class="code-pal ${loop ? 'loop' : ''}">${ORDER.map(d => `<button class="code-key k-${d}" data-d="${d}" aria-label="Panah ${DIRS[d].name}">${arrow(d)}</button>`).join('')}
        ${loop ? '<button class="code-key k-rep" data-rep="2" aria-label="Ulangi dua kali">×2</button><button class="code-key k-rep" data-rep="3" aria-label="Ulangi tiga kali">×3</button>' : ''}</div>
      <div class="code-act"><button class="btn btn-white btn-sm" data-act-code="del" aria-label="Hapus kartu">⌫ Hapus</button>
        <button class="btn btn-primary code-run" data-act-code="run">${Art.I.play} Jalankan</button></div>
    </div>`);
    host.appendChild(el);
    const board = U.$('.code-board', el), progEl = U.$('.code-prog', el);

    // Papan
    let cells = '';
    for (let rr = 0; rr < p.size; rr++) for (let cc = 0; cc < p.size; cc++) {
      const k = key(rr, cc), g = rr === p.goal[0] && cc === p.goal[1];
      cells += `<div class="code-cell ${(rr + cc) % 2 ? 'alt' : ''}">${p.rocks.has(k) ? rockSvg : ''}${g ? `<img class="code-goal" src="${ASSETS.q}" alt="Portal">` : ''}</div>`;
    }
    board.innerHTML = cells + `<div class="code-hero">${Art.mascot('senang')}</div>`;
    const hero = U.$('.code-hero', board);
    const place = ([rr, cc], instant) => {
      hero.style.transition = instant ? 'none' : '';
      hero.style.transform = `translate(${cc * 100}%, ${rr * 100}%)`;
    };
    place(p.start, true);

    function layout() {
      const S = Math.round(Math.max(180, Math.min(innerWidth - 32, 360, innerHeight - (innerHeight < 560 ? 160 : 458))));
      board.style.width = board.style.height = S + 'px';
    }
    layout();

    function renderProg() {
      let html = '';
      for (let i = 0; i < r.slots; i++) {
        const b = prog[i];
        html += b ? `<button class="code-card k-${b.d} ${i === sel ? 'sel' : ''}" data-i="${i}" aria-label="Kartu ${i + 1}: ${DIRS[b.d].name}${b.n > 1 ? ', ' + b.n + ' kali' : ''}">${arrow(b.d)}${b.n > 1 ? `<span class="rep">×${b.n}</span>` : ''}</button>`
                  : `<span class="code-slot" aria-hidden="true">${i + 1}</span>`;
      }
      progEl.innerHTML = html;
    }
    renderProg();

    el.addEventListener('click', e => {
      if (running || done) return;
      const card = e.target.closest('.code-card'), key_ = e.target.closest('[data-d]'), rep = e.target.closest('[data-rep]'), act = e.target.closest('[data-act-code]');
      if (card) { const i = +card.dataset.i; sel = sel === i ? -1 : i; Sound.play('tap'); renderProg(); return; }
      if (key_) {
        const d = key_.dataset.d;
        if (sel >= 0) { prog[sel] = { d, n: prog[sel].n || 1 }; sel = -1; }
        else if (prog.length < r.slots) prog.push({ d, n: 1 });
        else { UI.toast('Kotak kode sudah penuh. Sentuh kartu untuk menggantinya.'); Sound.play('soft'); return; }
        Sound.play('tap'); Sound.say(DIRS[d].name); renderProg(); return;
      }
      if (rep) {
        const i = sel >= 0 ? sel : prog.length - 1; if (i < 0) return;
        const n = +rep.dataset.rep; prog[i].n = prog[i].n === n ? 1 : n; Sound.play('tap');
        Sound.say(prog[i].n > 1 ? `${DIRS[prog[i].d].name}, ${CONTENT.NUM_WORDS[prog[i].n]} kali` : DIRS[prog[i].d].name); renderProg(); return;
      }
      if (act && act.dataset.actCode === 'del') {
        if (!prog.length) return;
        if (sel >= 0) { prog.splice(sel, 1); sel = -1; } else prog.pop();
        Sound.play('tap'); renderProg(); return;
      }
      if (act && act.dataset.actCode === 'run') run();
    });

    async function run() {
      if (!prog.length) { UI.toast('Pilih panah dulu, ya!'); Sound.say('Pilih panah dulu, ya!'); return; }
      running = true; sel = -1; renderProg(); el.classList.add('running');
      const res = simulate(p, prog), steps = expand(prog);
      // peta langkah → kartu untuk sorotan
      const owner = prog.flatMap((b, i) => Array(b.n || 1).fill(i));
      place(p.start, true); await U.wait(200);
      for (let i = 0; i < res.trail.length; i++) {
        if (dead) return;
        U.$$('.code-card', progEl).forEach((c, j) => c.classList.toggle('now', j === owner[i]));
        place(res.trail[i]); Sound.play('flip'); await U.wait(380);
      }
      U.$$('.code-card', progEl).forEach(c => c.classList.remove('now'));
      if (dead) return;
      if (res.end === 'goal') {
        done = true; el.classList.add('win'); hero.innerHTML = Art.mascot('rayakan');
        cb.onDone(Math.max(0, fails - (fix ? 1 : 0)) === 0 ? 1 : (fails - (fix ? 1 : 0)) <= 2 ? .5 : .2, board);
        return;
      }
      fails++;
      const failIdx = owner[res.trail.length];
      if (res.end === 'rock' || res.end === 'edge') {
        hero.classList.remove('bump'); void hero.offsetWidth; hero.classList.add('bump');
        if (failIdx !== undefined) { const c = U.$$('.code-card', progEl)[failIdx]; c && c.classList.add('bad'); }
      }
      const msg = res.end === 'rock' ? 'Ups, ada batu! Ubah kodenya, ya.' : res.end === 'edge' ? 'Ups, jalannya habis! Ubah kodenya, ya.' : 'Belum sampai ke portal. Tambah atau ubah panahnya, ya.';
      cb.onFail(msg);
      await U.wait(1300); if (dead) return;
      hero.classList.remove('bump'); place(p.start, true);
      U.$$('.code-card.bad', progEl).forEach(c => c.classList.remove('bad'));
      running = false; el.classList.remove('running');
    }

    const onResize = () => !dead && layout();
    window.addEventListener('resize', onResize);
    const api = { el, destroy() { dead = true; window.removeEventListener('resize', onResize); }, _debug: () => ({ p, prog, done, fails }) };
    Code._last = api;
    return api;
  }

  return { makePath, makeLoop, makeFix, simulate, expand, mount, DIRS, _last: null };
})();

/* =========================================================
   5. MISI: GENERATOR SOAL + KATALOG
   Katalog (MISSIONS) hanya berisi data. Generator membuat soal
   dari bank konten dengan jawaban yang selalu dapat divalidasi.
   Menambah misi baru = menambah satu objek di MISSIONS.
   ========================================================= */
const Gen = (() => {
  const C = CONTENT, { pick, sample, shuffle, targets, ri } = U;
  const ALPHA = 'ABCDEFGHIJKLMNOPRSTUWZ'.split(''); // tanpa Q,V,X,Y yang jarang dipakai anak
  const NUM = n => C.NUM_WORDS[n] || String(n);
  const enPool = k => k === 'all' ? Object.values(C.EN).flat() : k.split('+').flatMap(x => C.EN[x]);

  // ---- Potongan tampilan prompt ----
  const P = {
    glyph: (t, extra = '') => `<div class="prompt-card"><span class="glyph xl">${U.esc(t)}</span>${extra}</div>`,
    arab: (ch, name) => `<div class="prompt-card"><span class="glyph arab xl" lang="ar">${ch}</span><span class="word">${U.esc(name)}</span></div>`,
    listen: (label = 'Dengarkan') => `<div class="listen"><button class="listen-btn" data-act="say" aria-label="Dengarkan lagi">${Art.I.sound}</button><small>${U.esc(label)}</small></div>`,
    emoji: (e, extra = '', cls = '') => `<div class="prompt-card"><span class="emo xl ${cls}">${e}</span>${extra}</div>`,
    shape: (sid, col) => `<div class="prompt-card">${Art.shape(sid, col, 'shape')}</div>`.replace('class="shape"', 'class="shape" style="width:110px;height:110px"')
  };
  const opt = {
    glyph: (t, correct) => ({ html: `<span class="glyph">${U.esc(t)}</span>`, correct, name: t }),
    arab: (h, correct) => ({ html: `<span class="glyph arab" lang="ar">${h.ch}</span>`, correct, name: h.name }),
    emo: (e, correct, cap = '') => ({ html: `<span class="emo">${e}</span>${cap ? `<span class="cap">${U.esc(cap)}</span>` : ''}`, correct, name: cap || e }),
    color: (c, correct) => ({ html: Art.swatch(c.hex), correct, name: c.name, reveal: c.name }),
    shape: (sid, col, correct) => ({ html: Art.shape(sid, col), correct, name: C.shapeById(sid).name, reveal: C.shapeById(sid).name }),
    word: (txt, correct) => ({ html: `<span class="text">${U.esc(txt)}</span>`, correct, name: txt, cls: 'text-opt' }),
    text: (txt, ic, correct) => ({ html: `<span class="ic">${ic}</span><span class="text">${U.esc(txt)}</span>`, correct, name: txt, cls: 'text-opt' })
  };
  const choice = (o) => ({ kind: 'choice', cols: o.options.length === 4 ? 2 : o.options.length, ...o, options: shuffle(o.options) });
  const otherColors = (exclude, n) => sample(C.COLORS.filter(c => !exclude.includes(c.id)), n);

  const G = {
    /* ---------------- HURUF ---------------- */
    pickLetter({ letters, n = 3, mode = 'see' }, rounds) {
      const set = letters.split('');
      return targets(set, rounds).map(t => {
        const pool = set.length >= n ? set : ALPHA;
        const ds = sample(pool.filter(x => x !== t), n - 1);
        return choice({
          say: mode === 'see' ? `Cari huruf ${t}. Sentuh huruf yang sama!` : `Sentuh huruf ${t}.`,
          prompt: mode === 'see' ? P.glyph(t) : P.listen('Dengarkan, lalu sentuh hurufnya'),
          hint: mode === 'see' ? 'Lihat baik-baik bentuk hurufnya, ya.' : `Dengarkan lagi. Huruf ${t}.`,
          options: [opt.glyph(t, true), ...ds.map(d => opt.glyph(d, false))]
        });
      });
    },
    letterInitial({ n = 3 }, rounds) {
      return sample(C.WORDS, rounds).map(w => {
        const ds = sample(ALPHA.filter(x => x !== w.initial), n - 1);
        const rest = U.esc(w.word.slice(1).toLowerCase());
        return choice({
          say: `${w.word}. ${w.word} dimulai dengan huruf apa?`,
          prompt: P.emoji(w.emo, `<span class="word"><span class="blank">?</span>${rest}</span>`),
          hint: `Ucapkan pelan-pelan: ${w.word}. Bunyi pertamanya apa?`,
          reveal: `${w.word} dimulai dengan huruf ${w.initial}`,
          options: [opt.glyph(w.initial, true), ...ds.map(d => opt.glyph(d, false))]
        });
      });
    },
    initialSound({ n = 3 }, rounds) {
      const initials = [...new Set(C.WORDS.map(w => w.initial))];
      return targets(initials, rounds).map(L => {
        const right = pick(C.WORDS.filter(w => w.initial === L));
        const others = [];
        for (const w of shuffle(C.WORDS)) {
          if (w.initial !== L && !others.some(o => o.initial === w.initial)) others.push(w);
          if (others.length === n - 1) break;
        }
        return choice({
          say: `Pilih gambar yang dimulai dengan huruf ${L}.`,
          prompt: P.glyph(L),
          hint: 'Sebutkan nama setiap gambar. Mana yang bunyinya mirip?',
          reveal: `${right.word} dimulai dengan huruf ${L}`,
          options: [opt.emo(right.emo, true, right.word), ...others.map(o => opt.emo(o.emo, false, o.word))]
        });
      });
    },

    /* ---------------- ANGKA ---------------- */
    countObjects({ min = 1, max = 5, n = 3 }, rounds) {
      const counts = targets(Array.from({ length: max - min + 1 }, (_, i) => i + min), rounds);
      return counts.map(k => {
        const o = pick(C.COUNT_OBJS);
        const near = shuffle([k - 2, k - 1, k + 1, k + 2].filter(x => x >= 1 && x <= 10 && x !== k)).slice(0, n - 1);
        const items = Array.from({ length: k }, () => `<button class="count-item" data-count aria-label="${o.name}"><span class="emo">${o.emo}</span></button>`).join('');
        return choice({
          say: `Ada berapa ${o.name}? Ayo kita hitung!`,
          prompt: `<div class="count-grid">${items}</div>`,
          hint: `Sentuh ${o.name} satu per satu sambil menghitung.`,
          reveal: `Ada ${NUM(k)} ${o.name}`,
          options: [opt.glyph(String(k), true), ...near.map(x => opt.glyph(String(x), false))]
        });
      });
    },
    pickNumber({ min = 1, max = 5, n = 3 }, rounds) {
      return targets(Array.from({ length: max - min + 1 }, (_, i) => i + min), rounds).map(k => {
        const pool = Array.from({ length: Math.max(max, 5) }, (_, i) => i + 1).filter(x => x !== k);
        return choice({
          say: `Sentuh angka ${NUM(k)}.`,
          prompt: P.listen(`Angka ${NUM(k)}`),
          hint: `Dengarkan lagi. Angka ${NUM(k)}.`,
          options: [opt.glyph(String(k), true), ...sample(pool, n - 1).map(x => opt.glyph(String(x), false))]
        });
      });
    },
    compare({ max = 6, minDiff = 2, ask = 'banyak' }, rounds) {
      return Array.from({ length: rounds }, () => {
        let a, b; do { a = ri(1, max); b = ri(1, max); } while (Math.abs(a - b) < minDiff);
        const askMore = ask === 'banyak' || (ask === 'campur' && Math.random() < .6);
        const o = pick(C.COUNT_OBJS);
        const grp = k => `<span class="group">${Array.from({ length: k }, () => `<span class="emo" style="font-size:30px">${o.emo}</span>`).join('')}</span>`;
        const bigger = a > b;
        return {
          kind: 'choice', cols: 2,
          say: askMore ? `Mana yang lebih banyak?` : `Mana yang lebih sedikit?`,
          prompt: `<div class="prompt-card" style="padding:12px 20px"><span class="word">${askMore ? 'Lebih banyak' : 'Lebih sedikit'}</span></div>`,
          hint: 'Hitung isi setiap kotak, lalu bandingkan.',
          options: [
            { html: grp(a), correct: askMore ? bigger : !bigger, name: `${NUM(a)} ${o.name}` },
            { html: grp(b), correct: askMore ? !bigger : bigger, name: `${NUM(b)} ${o.name}` }
          ]
        };
      });
    },
    orderNumbers({ mode = 'seq', size = 4, max = 10 }, rounds) {
      return Array.from({ length: rounds }, () => {
        const vals = mode === 'seq' ? Array.from({ length: size }, (_, i) => i + 1)
          : sample(Array.from({ length: max }, (_, i) => i + 1), size).sort((x, y) => x - y);
        return {
          kind: 'order',
          say: mode === 'seq' ? `Urutkan angkanya. Mulai dari angka ${NUM(vals[0])}!` : 'Urutkan angka dari yang paling kecil sampai paling besar.',
          hint: 'Cari angka yang paling kecil dulu.',
          answer: vals,
          items: shuffle(vals).map(v => ({ value: v, html: `<span class="glyph">${v}</span>` }))
        };
      });
    },
    numberAfter({ max = 9 }, rounds) {
      return targets(Array.from({ length: max - 1 }, (_, i) => i + 2), rounds).map(k => {
        const ds = shuffle([k - 1, k + 1, k + 2, k - 2].filter(x => x >= 1 && x <= 10 && x !== k + 1)).slice(0, 2);
        return choice({
          say: `Setelah angka ${NUM(k)}, angka berapa?`,
          prompt: `<div class="seq"><span class="cell"><span class="glyph">${k - 1}</span></span><span class="cell"><span class="glyph">${k}</span></span><span class="cell q">?</span></div>`,
          hint: `Ayo berhitung: ${NUM(k - 1)}, ${NUM(k)}, ...`,
          reveal: `Setelah ${NUM(k)} adalah ${NUM(k + 1)}`,
          options: [opt.glyph(String(k + 1), true), ...ds.map(x => opt.glyph(String(x), false))]
        });
      });
    },
    addSimple({ maxSum = 5 }, rounds) {
      return Array.from({ length: rounds }, () => {
        const a = ri(1, maxSum - 1), b = ri(1, maxSum - a), s = a + b, o = pick(C.COUNT_OBJS);
        const grp = k => `<span class="group">${Array.from({ length: k }, () => `<span class="emo">${o.emo}</span>`).join('')}</span>`;
        const ds = shuffle([s - 1, s + 1, s + 2].filter(x => x >= 1)).slice(0, 2);
        return choice({
          say: `${NUM(a)} ${o.name}, ditambah ${NUM(b)} ${o.name}. Jadi berapa semuanya?`,
          prompt: `<div class="groups">${grp(a)}<span class="plus">+</span>${grp(b)}</div>`,
          hint: 'Hitung semua gambarnya bersama-sama.',
          reveal: `${a} + ${b} = ${s}`,
          options: [opt.glyph(String(s), true), ...ds.map(x => opt.glyph(String(x), false))]
        });
      });
    },

    /* ---------------- WARNA & BENTUK ---------------- */
    pickColor({ n = 3, pool = 6 }, rounds) {
      const cols = C.COLORS.slice(0, pool);
      return targets(cols, rounds).map(c => choice({
        say: `Sentuh warna ${c.name}.`,
        prompt: P.listen(`Warna ${c.name}`),
        hint: `Cari warna ${c.name}.`,
        reveal: `Ini warna ${c.name}`,
        options: [opt.color(c, true), ...sample(cols.filter(x => x.id !== c.id), n - 1).map(x => opt.color(x, false))]
      }));
    },
    objectColor({ n = 3 }, rounds) {
      return sample(C.COLOR_OBJECTS, rounds).map(o => {
        const c = C.colorById(o.color);
        return choice({
          say: `Apa warna ${o.name}?`,
          prompt: P.emoji(o.emo, `<span class="word">${U.esc(o.name)}</span>`),
          hint: `Lihat warna ${o.name} itu.`,
          reveal: `${o.name} berwarna ${c.name}`,
          options: [opt.color(c, true), ...otherColors([c.id], n - 1).map(x => opt.color(x, false))]
        });
      });
    },
    pickShape({ n = 3, pool = 4 }, rounds) {
      const shapes = C.SHAPES.slice(0, pool);
      return targets(shapes, rounds).map(s => {
        const others = sample(shapes.filter(x => x.id !== s.id), n - 1);
        const cols = sample(C.COLORS.slice(0, 6), n);
        return choice({
          say: `Sentuh bentuk ${s.name}.`,
          prompt: P.listen(`Bentuk ${s.name}`),
          hint: `Dengarkan lagi. Bentuk ${s.name}.`,
          options: [opt.shape(s.id, cols[0].hex, true), ...others.map((o, i) => opt.shape(o.id, cols[i + 1].hex, false))]
        });
      });
    },
    sameShape({ n = 3 }, rounds) {
      const shapes = C.SHAPES;
      return targets(shapes, rounds).map(s => {
        const others = sample(shapes.filter(x => x.id !== s.id), n - 1);
        const cols = sample(C.COLORS.slice(0, 7), n + 1);
        return choice({
          say: 'Cari bentuk yang sama dengan ini.',
          prompt: P.shape(s.id, cols[n].hex),
          hint: 'Warnanya boleh berbeda. Lihat bentuknya saja.',
          options: [opt.shape(s.id, cols[0].hex, true), ...others.map((o, i) => opt.shape(o.id, cols[i + 1].hex, false))]
        });
      });
    },
    findColor({ total = 8, k = 3 }, rounds) {
      const usable = C.COLORS.filter(c => C.COLOR_OBJECTS.filter(o => o.color === c.id).length >= k);
      return targets(usable, rounds).map(c => {
        const right = sample(C.COLOR_OBJECTS.filter(o => o.color === c.id), k);
        const wrong = sample(C.COLOR_OBJECTS.filter(o => o.color !== c.id), total - k);
        return {
          kind: 'findAll', cols: 4,
          say: `Sentuh semua benda berwarna ${c.name}.`,
          prompt: `<div class="prompt-card" style="flex-direction:row;gap:12px;padding:10px 18px">${Art.swatch(c.hex, 'swatch')}<span class="word">${U.esc(c.name)}</span></div>`,
          hint: `Cari benda yang warnanya ${c.name}.`,
          items: shuffle([...right.map(o => ({ html: `<span class="emo">${o.emo}</span>`, correct: true, name: o.name })),
                          ...wrong.map(o => ({ html: `<span class="emo">${o.emo}</span>`, correct: false, name: o.name }))])
        };
      });
    },
    findShape({ total = 8, k = 3, pool = 4 }, rounds) {
      const shapes = C.SHAPES.slice(0, pool);
      return targets(shapes, rounds).map(s => {
        const colsR = sample(C.COLORS.slice(0, 6), k);
        const others = Array.from({ length: total - k }, () => pick(shapes.filter(x => x.id !== s.id)));
        return {
          kind: 'findAll', cols: 4,
          say: `Sentuh semua bentuk ${s.name}.`,
          prompt: `<div class="prompt-card" style="flex-direction:row;gap:10px;padding:10px 18px">${Art.shape(s.id, '#B9A3EE')}<span class="word">${U.esc(s.name)}</span></div>`,
          hint: `Cari semua bentuk ${s.name}, warnanya boleh berbeda.`,
          items: shuffle([...colsR.map(c => ({ html: Art.shape(s.id, c.hex), correct: true, name: s.name })),
                          ...others.map(o => ({ html: Art.shape(o.id, pick(C.COLORS.slice(0, 6)).hex), correct: false, name: o.name }))])
        };
      });
    },

    /* ---------------- LOGIKA ---------------- */
    pattern({ types = ['AB'] }, rounds) {
      return Array.from({ length: rounds }, () => {
        const type = pick(types);
        const set = shuffle(pick(C.PATTERN_SETS));
        const unit = type.split('').map(ch => set['ABC'.indexOf(ch)]);
        const shown = unit.length === 2 ? 5 : (type === 'ABC' ? 5 : 5);
        const seq = Array.from({ length: shown + 1 }, (_, i) => unit[i % unit.length]);
        const answer = seq[shown];
        const distinct = [...new Set(unit)];
        const pool = [...distinct, ...set.filter(x => !distinct.includes(x))];
        const opts = [answer, ...pool.filter(x => x !== answer)].slice(0, 3);
        return choice({
          say: 'Lihat polanya. Apa yang selanjutnya?',
          prompt: `<div class="seq">${seq.slice(0, shown).map(e => `<span class="cell"><span class="emo">${e}</span></span>`).join('')}<span class="cell q">?</span></div>`,
          hint: 'Ucapkan polanya sambil menunjuk satu per satu.',
          options: opts.map((e, i) => opt.emo(e, i === 0))
        });
      });
    },
    oddOne({ level = 1 }, rounds) {
      const keys = Object.keys(C.CATEGORIES);
      return Array.from({ length: rounds }, () => {
        const [k1, k2] = sample(keys, 2), A = C.CATEGORIES[k1], B = C.CATEGORIES[k2];
        const odd = pick(B.items);
        const same = level === 1 ? Array(3).fill(pick(A.items)) : sample(A.items, 3);
        return choice({
          cols: 2,
          say: level === 1 ? 'Mana yang berbeda?' : `Tiga gambar ini satu kelompok. Mana yang bukan kelompoknya?`,
          prompt: '',
          hint: level === 1 ? 'Cari gambar yang tidak sama dengan yang lain.' : `Tiga gambar adalah ${A.name}. Mana yang bukan ${A.name}?`,
          reveal: level === 2 ? `Yang lain adalah ${A.name}` : '',
          options: [opt.emo(odd, true), ...same.map(e => opt.emo(e, false))]
        });
      });
    },
    sizeCompare(_, rounds) {
      return Array.from({ length: rounds }, () => {
        const e = pick(C.PICS), big = Math.random() < .5;
        const sizes = shuffle([28, 46, 70]);
        const target = big ? 70 : 28;
        return choice({
          say: big ? 'Sentuh yang paling besar.' : 'Sentuh yang paling kecil.',
          prompt: `<div class="prompt-card" style="padding:10px 18px"><span class="word">${big ? 'Paling besar' : 'Paling kecil'}</span></div>`,
          hint: 'Bandingkan ukurannya.',
          options: sizes.map(s => ({ html: `<span class="emo" style="font-size:${s}px">${e}</span>`, correct: s === target, name: s === 70 ? 'besar' : s === 28 ? 'kecil' : 'sedang' }))
        });
      });
    },
    shadow({ n = 3 }, rounds) {
      return sample(C.PICS, rounds).map(e => {
        const ds = sample(C.PICS.filter(x => x !== e), n - 1);
        return choice({
          say: 'Ini bayangan apa? Pilih gambar yang cocok.',
          prompt: P.emoji(e, '', 'shadow'),
          hint: 'Lihat bentuk bayangannya baik-baik.',
          options: [opt.emo(e, true), ...ds.map(d => opt.emo(d, false))]
        });
      });
    },
    memory({ pairs = 3, set = 'pics' }) {
      let cards;
      if (set === 'case') {
        const ls = sample(ALPHA, pairs);
        cards = ls.flatMap(l => [{ key: l, html: `<span class="glyph">${l}</span>` }, { key: l, html: `<span class="glyph">${l.toLowerCase()}</span>` }]);
      } else if (set === 'hijaiyah') {
        const hs = sample(C.HIJAIYAH, pairs);
        cards = hs.flatMap(h => [0, 1].map(() => ({ key: h.ch, html: `<span class="glyph arab" lang="ar">${h.ch}</span>` })));
      } else if (set === 'en') {
        const ws = sample(enPool('animals+fruits').filter(w => w.en.length <= 7), pairs);
        cards = ws.flatMap(w => [
          { key: 'en:' + w.en, html: `<span class="emo">${w.emo}</span>`, voice: `[[en:${w.en}]]` },
          { key: 'en:' + w.en, html: `<span class="etxt">${w.en}</span>`, voice: `[[en:${w.en}]]` }]);
      } else {
        const ps = sample(C.PICS, pairs);
        cards = ps.flatMap(p => [0, 1].map(() => ({ key: p, html: `<span class="emo">${p}</span>` })));
      }
      const say = set === 'case' ? 'Buka kartunya. Cari pasangan huruf besar dan huruf kecil!' : set === 'en' ? 'Buka dua kartu. Cocokkan gambar dengan katanya!' : 'Buka dua kartu. Cari gambar yang sama!';
      return [{ kind: 'memory', say, hint: 'Ingat-ingat letak kartunya, ya.', cols: pairs <= 3 ? 3 : (pairs <= 4 ? 4 : 4), cards: shuffle(cards) }];
    },

    /* ---------------- KEBIASAAN BAIK ---------------- */
    habitOrder({ routines, len = 0 }, rounds) {
      const hs = targets(routines.map(id => C.HABITS.find(h => h.id === id)), rounds);
      return hs.map(h => {
        const n = h.steps.length, take = len && len < n ? len : n;
        // Ambil langkah secara berurutan (selalu termasuk langkah pertama dan terakhir)
        let idx = Array.from({ length: n }, (_, i) => i);
        if (take < n) { const mid = sample(idx.slice(1, -1), take - 2); idx = [0, ...mid, n - 1].sort((a, b) => a - b); }
        let items = shuffle(idx);
        while (items.every((v, k) => v === idx[k])) items = shuffle(idx);
        return {
          kind: 'order', steps: true,
          say: `Urutkan langkah ${h.title.toLowerCase()}. Mana yang pertama?`,
          prompt: `<div class="prompt-card habit-title"><span class="emo">${h.ic}</span><span class="word">${U.esc(h.title)}</span></div>`,
          hint: 'Apa yang dilakukan paling awal? Ayo pikirkan lagi.',
          reveal: `Begitulah urutan ${h.title.toLowerCase()}`,
          answer: idx,
          items: items.map(v => { const s = h.steps[v];
            return { value: v, name: s.label, say: s.label, slotHtml: `<span class="emo">${s.emo}</span>`,
              html: `<span class="emo">${s.emo}</span><span class="lbl">${U.esc(s.label)}</span>` }; })
        };
      });
    },
    habitNext({ routines, n = 3 }, rounds) {
      const hs = targets(routines.map(id => C.HABITS.find(h => h.id === id)), rounds);
      return hs.map(h => {
        const k = ri(1, h.steps.length - 1), right = h.steps[k];
        const others = h.steps.filter((_, i) => i !== k);
        const ds = sample(others, n - 1);
        const cells = h.steps.slice(0, k).map(s => `<span class="cell"><span class="emo">${s.emo}</span></span>`).join('') + '<span class="cell q">?</span>';
        return choice({
          cols: 1,
          say: `Kita sedang ${h.title.toLowerCase()}. Apa langkah selanjutnya?`,
          prompt: `<div class="prompt-card habit-title"><span class="emo">${h.ic}</span><span class="word">${U.esc(h.title)}</span></div><div class="seq" style="margin-top:10px">${cells}</div>`,
          hint: 'Lihat langkah yang sudah dilakukan. Apa yang berikutnya?',
          reveal: `Selanjutnya: ${right.label}`,
          options: [opt.text(right.label, right.emo, true), ...ds.map(d => opt.text(d.label, d.emo, false))]
        });
      });
    },

    /* ---------------- BAHASA INGGRIS ---------------- */
    engHear({ pool = 'animals', n = 3 }, rounds) {
      const set = enPool(pool);
      return targets(set, rounds).map(w => {
        const ds = sample(set.filter(x => x.en !== w.en && x.emo !== w.emo), n - 1);
        return choice({
          say: 'Dengarkan, lalu sentuh gambarnya!',
          voice: `Dengarkan. [[en:${w.en}]]. Sentuh gambar [[en:${w.en}]]!`,
          prompt: P.listen('Dengarkan, lalu sentuh gambarnya'),
          hint: 'Tekan tombol suara untuk mendengarkan lagi.',
          reveal: `[[en:${w.en}]] artinya ${w.id}`,
          options: [opt.emo(w.emo, true), ...ds.map(d => opt.emo(d.emo, false))]
        });
      });
    },
    engSee({ pool = 'animals+fruits', n = 3 }, rounds) {
      const set = enPool(pool);
      return targets(set, rounds).map(w => {
        const ds = sample(set.filter(x => x.en !== w.en && x.emo !== w.emo), n - 1);
        const opts = shuffle([opt.word(w.en, true), ...ds.map(d => opt.word(d.en, false))]);
        return {
          kind: 'choice', cols: 1,
          say: 'Ini gambar apa dalam bahasa Inggris?',
          voice: `Ini gambar apa dalam bahasa Inggris? ${opts.map(o => `[[en:${o.name}]]`).join(', ')}?`,
          prompt: P.emoji(w.emo),
          hint: 'Tekan tombol suara untuk mendengarkan pilihannya lagi.',
          reveal: `[[en:${w.en}]] artinya ${w.id}`,
          options: opts
        };
      });
    },
    engColor({ n = 3, pool = 6 }, rounds) {
      const set = C.COLORS.slice(0, pool);
      return targets(set, rounds).map(c => {
        const en = C.EN_COLORS[c.id], ds = sample(set.filter(x => x.id !== c.id), n - 1);
        return choice({
          say: 'Dengarkan, lalu sentuh warnanya!',
          voice: `Dengarkan. [[en:${en}]]. Sentuh warna [[en:${en}]]!`,
          prompt: P.listen('Dengarkan, lalu sentuh warnanya'),
          hint: 'Tekan tombol suara untuk mendengarkan lagi.',
          reveal: `[[en:${en}]] artinya ${c.name}`,
          options: [opt.color(c, true), ...ds.map(d => opt.color(d, false))]
        });
      });
    },
    engNumber({ min = 1, max = 5, n = 3 }, rounds) {
      const set = Array.from({ length: max - min + 1 }, (_, i) => i + min);
      return targets(set, rounds).map(k => {
        const en = C.EN_NUMS[k], ds = sample(set.filter(x => x !== k), n - 1);
        return choice({
          say: 'Dengarkan, lalu sentuh angkanya!',
          voice: `Dengarkan. [[en:${en}]]. Sentuh angka [[en:${en}]]!`,
          prompt: P.listen('Dengarkan, lalu sentuh angkanya'),
          hint: 'Tekan tombol suara untuk mendengarkan lagi.',
          reveal: `[[en:${en}]] artinya ${NUM(k)}`,
          options: [opt.glyph(String(k), true), ...ds.map(x => opt.glyph(String(x), false))]
        });
      });
    },
    engGreet({ n = 3 }, rounds) {
      return sample(C.GREETINGS, rounds).map(g => {
        const ds = sample(C.GREETINGS.filter(x => x.en !== g.en), n - 1);
        const opts = shuffle([g, ...ds]).map(x => opt.text(x.en, '🔊', x === g));
        return {
          kind: 'choice', cols: 1,
          say: g.situasi,
          voice: `${g.situasi} ${opts.map(o => `[[en:${o.name}]]`).join(', atau ')}?`,
          prompt: P.emoji(g.ic, `<span class="word" style="font-size:19px;text-align:center;max-width:280px">${U.esc(g.situasi)}</span>`),
          hint: 'Tekan tombol suara untuk mendengarkan pilihannya lagi.',
          reveal: `[[en:${g.en}]] artinya ${g.id}`,
          options: opts
        };
      });
    },

    /* ---------------- KODE ---------------- */
    code({ mode = 'path', size = 4, len = [2, 3], rocks = [0, 0], detour = false, segs = 2 }, rounds) {
      const out = [];
      for (let k = 0; k < rounds; k++) {
        let puzzle = null, slots;
        if (mode === 'loop') { puzzle = Code.makeLoop({ size, segs }); slots = segs; }
        else if (mode === 'fix') { puzzle = Code.makeFix({ size, len, rocks, detour }); slots = puzzle && puzzle.solution.length; }
        else { puzzle = Code.makePath({ size, len, rocks, detour }); slots = puzzle && (len[1] === 1 ? 1 : puzzle.solution.length + 1); }
        if (!puzzle) continue;
        const hasRock = puzzle.rocks.size > 0 && mode === 'path' && rocks[1] > 0;
        out.push({ kind: 'code', mode, puzzle, slots,
          say: mode === 'fix' ? 'Ada panah yang salah! Tekan Jalankan, lalu perbaiki panahnya.'
             : mode === 'loop' ? 'Kotak kodenya sedikit! Pakai kartu kali dua atau kali tiga untuk mengulang langkah.'
             : hasRock ? 'Bantu bintang ke portal. Hati-hati, jangan menabrak batu!'
             : 'Bantu bintang ke portal! Pilih panahnya, lalu tekan Jalankan.',
          hint: mode === 'fix' ? 'Sentuh kartu yang salah, lalu pilih panah yang benar.'
              : mode === 'loop' ? 'Pilih panah, lalu sentuh kali dua atau kali tiga.'
              : 'Hitung kotaknya dulu: ke kanan berapa, ke bawah berapa?' });
      }
      return out;
    },

    /* ---------------- MENEBALKAN ---------------- */
    trace({ kind = 'latin', set = '', from = 0, to = 6 }, rounds) {
      if (kind === 'hijaiyah') {
        const pool = C.HIJAIYAH.slice(from, to + 1);
        const picks = (rounds >= pool.length ? pool : sample(pool, rounds)).sort((a, b) => C.HIJAIYAH.indexOf(a) - C.HIJAIYAH.indexOf(b));
        return picks.map(h => ({ kind: 'trace', mode: 'mask', ch: h.ch, label: h.name,
          say: `Ini huruf ${h.name}. Tebalkan hurufnya dengan jarimu sampai penuh, ya.`,
          hint: 'Gosok pelan-pelan di atas huruf yang samar, ya.', reveal: `Ini huruf ${h.name}` }));
      }
      const chars = set.split('');
      const picks = (rounds >= chars.length ? chars : sample(chars, rounds)).sort((a, b) => chars.indexOf(a) - chars.indexOf(b));
      return picks.map(ch => {
        const digit = /\d/.test(ch), nm = digit ? `angka ${NUM(+ch)}` : `huruf ${ch}`;
        return { kind: 'trace', mode: 'path', ch, strokes: Trace.strokesOf(ch),
          say: `Tebalkan ${nm}. Mulai dari titik hijau, lalu ikuti titik-titiknya.`,
          hint: 'Ikuti titik-titiknya, mulai dari titik hijau.', reveal: `Ini ${nm}` };
      });
    },

    /* ---------------- HIJAIYAH ---------------- */
    pickHijaiyah({ from = 0, to = 6, n = 3, mode = 'see' }, rounds) {
      const set = C.HIJAIYAH.slice(from, to + 1);
      return targets(set, rounds).map(h => {
        const pool = (set.length >= n ? set : C.HIJAIYAH).filter(x => x.ch !== h.ch && x.name !== h.name);
        const ds = [];
        for (const x of shuffle(pool)) { if (!ds.some(d => d.name === x.name)) ds.push(x); if (ds.length === n - 1) break; }
        return choice({
          say: mode === 'see' ? `Ini huruf ${h.name}. Sentuh huruf ${h.name} yang sama!` : `Sentuh huruf ${h.name}.`,
          prompt: mode === 'see' ? P.arab(h.ch, h.name) : P.listen(`Huruf ${h.name}`),
          hint: mode === 'see' ? 'Perhatikan titik dan bentuk hurufnya.' : `Dengarkan lagi. Huruf ${h.name}.`,
          reveal: `Ini huruf ${h.name}`,
          options: [opt.arab(h, true), ...ds.map(d => opt.arab(d, false))]
        });
      });
    },
    ucapan({ n = 3 }, rounds) {
      return sample(C.UCAPAN, rounds).map(u => {
        const rightKey = u.same || u.id;
        const texts = new Set([u.text]);
        const ds = [];
        for (const x of shuffle(C.UCAPAN)) {
          if ((x.same || x.id) !== rightKey && !texts.has(x.text)) { texts.add(x.text); ds.push(x); }
          if (ds.length === n - 1) break;
        }
        const opts = shuffle([opt.text(u.text, '⭐', true), ...ds.map(d => opt.text(d.text, '⭐', false))]);
        return {
          kind: 'choice', cols: 1,
          say: `${u.situasi} ${opts.map(o => o.name).join(', atau ')}?`,
          prompt: P.emoji(u.ic, `<span class="word" style="font-size:19px;text-align:center;max-width:280px">${U.esc(u.situasi)}</span>`),
          hint: 'Dengarkan lagi pilihannya, ya.',
          reveal: `Kita mengucapkan ${u.text}`,
          options: opts
        };
      });
    }
  };
  return G;
})();
